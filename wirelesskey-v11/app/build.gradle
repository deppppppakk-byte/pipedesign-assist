plugins { id 'com.android.application' }

android {
    namespace 'com.wirelesskey.remote'
    compileSdk 36

    defaultConfig {
        applicationId "com.wirelesskey.remote"
        minSdk 23
        targetSdk 36
        versionCode 10
        versionName "4.1.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

plugins { id 'com.android.application' }

def wkStoreFile = System.getenv("WIRELESSKEY_ANDROID_KEYSTORE")
def wkStorePassword = System.getenv("WIRELESSKEY_ANDROID_STORE_PASSWORD")
def wkKeyAlias = System.getenv("WIRELESSKEY_ANDROID_KEY_ALIAS")
def wkKeyPassword = System.getenv("WIRELESSKEY_ANDROID_KEY_PASSWORD")
def wkHasReleaseSigning = wkStoreFile && wkStorePassword && wkKeyAlias && wkKeyPassword

android {
    namespace 'com.wirelesskey.remote'
    compileSdk 36

    defaultConfig {
        applicationId "com.wirelesskey.remote"
        minSdk 23
        targetSdk 36
        versionCode 16
        versionName "4.5"
    }

    signingConfigs {
        wirelessRelease {
            if (wkHasReleaseSigning) {
                storeFile file(wkStoreFile)
                storePassword wkStorePassword
                keyAlias wkKeyAlias
                keyPassword wkKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig wkHasReleaseSigning ? signingConfigs.wirelessRelease : signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
}

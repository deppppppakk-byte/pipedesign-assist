<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#08111f"/>
<title>WirelessKey 3.1</title>
<style>
:root{
  --bg:#08111f;--panel:#0f1a2b;--panel2:#142238;--key:#1d2b40;--key2:#243650;
  --line:#30435e;--text:#f8fafc;--muted:#90a2bb;--accent:#60a5fa;--ok:#34d399;
  --warn:#fbbf24;--bad:#fb7185;--press:#3a526f
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{height:100dvh;display:flex;flex-direction:column;gap:5px;padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom))}
.topbar{min-height:35px;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid #1d2b40;border-radius:10px;padding:4px 5px}
.brand{font-weight:850;font-size:13px;white-space:nowrap}.brand b{color:var(--accent)}
.topbar input,.topbar select{height:27px;background:#091321;border:1px solid var(--line);border-radius:7px;color:var(--text);font-size:10px;outline:none;padding:0 7px}
#host{width:136px}#code{width:62px;text-align:center;letter-spacing:1.4px}
#devices{width:135px;display:none}
.tbtn{height:27px;border:1px solid var(--line);border-radius:7px;background:#16263c;color:#dbeafe;font-size:10px;font-weight:700;padding:0 8px}
.tbtn.primary{background:#1d4ed8;border-color:#2563eb;color:white}.tbtn.active{background:#164e63;border-color:#22d3ee}
.contextPill{height:24px;display:flex;align-items:center;gap:4px;padding:0 7px;border:1px solid #2b415e;border-radius:999px;background:#0c1728;color:#9fb5d0;font-size:8px;white-space:nowrap;max-width:190px;overflow:hidden}
.contextPill span,.contextPill b{overflow:hidden;text-overflow:ellipsis}
.contextPill b{color:#dbeafe;font-weight:800;max-width:85px}
.contextPill .latency{color:#7dd3fc;font-variant-numeric:tabular-nums;flex:none}
.status{margin-left:auto;display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:9px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:#64748b;box-shadow:0 0 0 2px rgba(100,116,139,.12)}
.status.ok .dot{background:var(--ok);box-shadow:0 0 0 2px rgba(52,211,153,.14)}
.status.bad .dot{background:var(--bad)}.status.busy .dot{background:var(--warn)}

.workspace{flex:1;min-height:0;display:flex;gap:5px}
.keyboardPane{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;transition:.15s}
.functionRow{height:9.5%;min-height:29px;display:flex;gap:3px}
.keyboard{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:3px;flex:1;min-height:0}
.key{position:relative;flex:1;min-width:0;border:1px solid #324762;border-radius:7px;background:linear-gradient(#243650,#1b293d);color:var(--text);font-weight:680;font-size:clamp(10px,1.5vw,15px);box-shadow:inset 0 -2px rgba(0,0,0,.22);touch-action:none;user-select:none;-webkit-user-select:none}
.key:active,.key.pressed{background:var(--press);transform:translateY(1px)}
.key.mod.active,.key.shift.active,.key.caps.active{background:#16365b;border-color:#60a5fa;box-shadow:inset 0 0 0 1px #60a5fa}
.key .main{display:block;line-height:1}.key .sub{position:absolute;top:3px;left:5px;font-size:8px;color:#a9bad0;font-weight:500}.key .main.withSub{padding-top:8px}
.key.w125{flex:1.25}.key.w14{flex:1.4}.key.w15{flex:1.5}.key.w17{flex:1.7}.key.w19{flex:1.9}.key.w22{flex:2.2}.key.w55{flex:5.5}
.key.fn{font-size:9px;background:linear-gradient(#1c2b40,#152237)}.key.arrow{font-size:15px}

.side{width:28%;min-width:165px;max-width:330px;display:flex;flex-direction:column;gap:4px;transition:.15s}
.sideTabs{height:28px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.sideTabs button{border:1px solid var(--line);background:#132136;color:#afc0d7;border-radius:7px;font-size:8px;font-weight:750}
.sideTabs button.active{background:#1d4ed8;color:#fff;border-color:#3b82f6}
.sidePanel{flex:1;min-height:0;display:none}.sidePanel.active{display:flex;flex-direction:column;gap:4px}

.touchpad{flex:1;min-height:0;position:relative;border:1px solid #364b68;border-radius:13px;background:radial-gradient(circle at 34% 22%,rgba(96,165,250,.08),transparent 38%),linear-gradient(145deg,#19283d,#0d1726);touch-action:none;overflow:hidden}
.touchpad .label{position:absolute;inset:0;display:grid;place-items:center;color:#657994;font-size:11px;pointer-events:none}
.touchpad .hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#536985;font-size:8px;pointer-events:none}
.touchpad .scrollzone{position:absolute;right:0;top:0;bottom:0;width:25px;border-left:1px solid rgba(148,163,184,.15);display:grid;place-items:center;color:#526780;font-size:8px;writing-mode:vertical-rl;pointer-events:none}
.mouseBtns{height:34px;display:grid;grid-template-columns:1fr 1fr 46px;gap:4px}
.mouseBtns button,.gridBtn{border:1px solid #354a65;border-radius:8px;background:var(--key2);color:var(--text);font-size:9px;font-weight:750}
.mouseBtns .expand{font-size:13px}

.numpad{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:4px;min-height:0}
.numpad .wide{grid-column:span 2}.numpad .tall{grid-row:span 2}

.mediaGrid,.shortGrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;min-height:0}
.mediaGrid button,.shortGrid button{border:1px solid #354a65;border-radius:9px;background:linear-gradient(#263a55,#1b2c43);color:#eef6ff;font-size:10px;font-weight:750}
.mediaGrid button:active,.shortGrid button:active,.gridBtn:active{background:#3c5575}
.shortGrid{grid-template-columns:repeat(2,1fr)}

.padOnly .keyboardPane{display:none}.padOnly .side{width:100%;max-width:none}.padOnly .touchpad .label{font-size:18px}.padOnly .touchpad .hint{font-size:11px}
.padOnly .sideTabs{grid-template-columns:repeat(5,minmax(60px,110px));justify-content:center}

@media(max-height:520px){
 .topbar{min-height:29px}.topbar input,.topbar select,.tbtn{height:23px}.functionRow{min-height:25px}
 .row,.keyboard,.keyboardPane{gap:2px}.key{border-radius:5px;font-size:10px}.key.fn{font-size:8px}
 .sideTabs{height:23px}.mouseBtns{height:29px}
}
@media(max-width:740px){.brand{display:none}#host{width:112px}#devices{width:110px}.side{width:31%;min-width:150px}}
@media(orientation:portrait){.workspace{flex-direction:column}.side{width:100%;max-width:none;height:28%}.keyboardPane{height:72%}.topbar{flex-wrap:wrap}.status{margin-left:0}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">Wireless<b>Key 3.1</b></div>
    <select id="devices"><option value="">Discovered PCs</option></select>
    <button class="tbtn" id="findBtn">Find PC</button>
    <input id="host" placeholder="PC IP"/>
    <input id="code" placeholder="6-digit" maxlength="6" inputmode="numeric"/>
    <button class="tbtn primary" id="connectBtn">Connect</button>
    <button class="tbtn active" id="hapticBtn">Haptic</button>
    <div class="contextPill"><span>App</span><b id="activeApp">Desktop</b><span class="latency" id="latency">— ms</span></div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Offline</span></div>
  </div>

  <div class="workspace" id="workspace">
    <div class="keyboardPane">
      <div class="functionRow" id="functionRow"></div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <div class="side">
      <div class="sideTabs">
        <button class="active" data-panel="mousePanel">Mouse</button>
        <button data-panel="numPanel">Num</button>
        <button data-panel="mediaPanel">Media</button>
        <button data-panel="shortPanel">Shortcuts</button>
        <button id="fullPadBtn">⛶</button>
      </div>

      <div class="sidePanel active" id="mousePanel">
        <div class="touchpad" id="pad">
          <div class="label">Precision Touchpad</div>
          <div class="hint">Tap click · Double-tap · Hold drag · 2-finger scroll</div>
          <div class="scrollzone">SCROLL</div>
        </div>
        <div class="mouseBtns">
          <button data-mouse="left">Left</button>
          <button data-mouse="right">Right</button>
          <button class="expand" id="expandPad">⛶</button>
        </div>
      </div>

      <div class="sidePanel" id="numPanel">
        <div class="numpad" id="numpad"></div>
      </div>

      <div class="sidePanel" id="mediaPanel">
        <div class="mediaGrid" id="mediaGrid"></div>
      </div>

      <div class="sidePanel" id="shortPanel">
        <div class="shortGrid" id="shortGrid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const hostEl=document.getElementById('host');
const codeEl=document.getElementById('code');
const devicesEl=document.getElementById('devices');
const statusEl=document.getElementById('status');
const statusText=document.getElementById('statusText');
const hapticBtn=document.getElementById('hapticBtn');
const app=document.getElementById('app');

let connected=false;
let haptics=true;

try{
  hostEl.value=(Android.loadHost()||'').replace(/:8765$/,'');
  codeEl.value=Android.loadCode()||'';
  haptics=Android.loadHaptics();
}catch(e){}
hapticBtn.classList.toggle('active',haptics);

function haptic(){if(haptics){try{Android.haptic()}catch(e){}}}
function save(){try{Android.saveSettings(hostEl.value,codeEl.value)}catch(e){}}

hostEl.addEventListener('change',save);
codeEl.addEventListener('input',()=>{codeEl.value=codeEl.value.replace(/\D/g,'').slice(0,6);save()});
hapticBtn.addEventListener('click',()=>{haptics=!haptics;hapticBtn.classList.toggle('active',haptics);try{Android.setHaptics(haptics)}catch(e){}});

function setStatus(kind,text){
  statusText.textContent=text;
  statusEl.className='status'+((kind==='connected'||kind==='ready')?' ok':(kind==='error')?' bad':(kind==='connecting'||kind==='authenticating'||kind==='reconnecting'||kind==='discovering')?' busy':'');
  connected=(kind==='connected'||kind==='ready');
  document.getElementById('connectBtn').textContent=connected?'Reconnect':'Connect';
}
window.onNativeStatus=(kind,detail)=>setStatus(kind,detail||kind);

document.getElementById('connectBtn').addEventListener('click',()=>{
  save();
  if(!hostEl.value.trim()){setStatus('error','Find or enter PC');return}
  if(codeEl.value.trim().length!==6){setStatus('error','Enter 6-digit code');return}
  setStatus('connecting','Connecting...');
  try{Android.connect(hostEl.value,codeEl.value)}catch(e){setStatus('error','Connection unavailable')}
});

document.getElementById('findBtn').addEventListener('click',()=>{
  devicesEl.innerHTML='<option value="">Searching...</option>';
  devicesEl.style.display='block';
  setStatus('discovering','Finding PCs...');
  try{Android.discover()}catch(e){setStatus('error','Discovery unavailable')}
});
window.onDiscoveryStart=()=>setStatus('discovering','Finding PCs...');
window.onDiscoveryResult=(d)=>{
  const value=d.ip+(d.port&&d.port!==8765?':'+d.port:'');
  if([...devicesEl.options].some(o=>o.value===value))return;
  const opt=document.createElement('option');
  opt.value=value;
  opt.textContent=(d.name||d.pcName||'WirelessKey PC')+' · '+d.ip;
  devicesEl.appendChild(opt);
  devicesEl.style.display='block';
};
window.onDiscoveryDone=()=>{
  const real=[...devicesEl.options].filter(o=>o.value);
  if(real.length===0){
    devicesEl.innerHTML='<option value="">No PC found</option>';
    setStatus('offline','Enter PC IP manually');
  }else{
    devicesEl.options[0].textContent='Choose PC ('+real.length+')';
    setStatus('offline','PC found · select it');
  }
};
devicesEl.addEventListener('change',()=>{
  if(devicesEl.value){
    hostEl.value=devicesEl.value;
    save();
  }
});

function send(event){
  try{Android.sendEvent(JSON.stringify(event))}catch(e){}
}
function sendKey(key,mods=[]){send({type:'key',key,modifiers:mods})}
function sendText(text){send({type:'text',text})}

// Right-side modes
document.querySelectorAll('.sideTabs button[data-panel]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    haptic();
    document.querySelectorAll('.sideTabs button[data-panel]').forEach(b=>b.classList.toggle('active',b===btn));
    document.querySelectorAll('.sidePanel').forEach(p=>p.classList.toggle('active',p.id===btn.dataset.panel));
  });
});
function toggleFullPad(){
  const on=!app.classList.contains('padOnly');
  app.classList.toggle('padOnly',on);
  if(on){
    document.querySelectorAll('.sideTabs button[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel==='mousePanel'));
    document.querySelectorAll('.sidePanel').forEach(p=>p.classList.toggle('active',p.id==='mousePanel'));
  }
}
document.getElementById('fullPadBtn').addEventListener('click',toggleFullPad);
document.getElementById('expandPad').addEventListener('click',toggleFullPad);

// Keyboard
const fnKeys=[
 {key:'ESC',label:'Esc',cls:'w125'}, {key:'F1',label:'F1'}, {key:'F2',label:'F2'}, {key:'F3',label:'F3'},
 {key:'F4',label:'F4'}, {key:'F5',label:'F5'}, {key:'F6',label:'F6'}, {key:'F7',label:'F7'},
 {key:'F8',label:'F8'}, {key:'F9',label:'F9'}, {key:'F10',label:'F10'}, {key:'F11',label:'F11'}, {key:'F12',label:'F12'},
 {key:'INSERT',label:'Ins'}, {key:'DELETE',label:'Del'}
];
const rows=[
 [
  {normal:'`',shift:'~',sub:'~'},{normal:'1',shift:'!',sub:'!'},{normal:'2',shift:'@',sub:'@'},
  {normal:'3',shift:'#',sub:'#'},{normal:'4',shift:'$',sub:'$'},{normal:'5',shift:'%',sub:'%'},
  {normal:'6',shift:'^',sub:'^'},{normal:'7',shift:'&',sub:'&'},{normal:'8',shift:'*',sub:'*'},
  {normal:'9',shift:'(',sub:'('},{normal:'0',shift:')',sub:')'},{normal:'-',shift:'_',sub:'_'},
  {normal:'=',shift:'+',sub:'+'},{key:'BACKSPACE',label:'Backspace',cls:'w19'}
 ],
 [
  {key:'TAB',label:'Tab',cls:'w15'},...'qwertyuiop'.split('').map(c=>({normal:c})),
  {normal:'[',shift:'{',sub:'{'},{normal:']',shift:'}',sub:'}'},{normal:'\\',shift:'|',sub:'|',cls:'w15'}
 ],
 [
  {key:'CAPSLOCK',label:'Caps Lock',cls:'w17',type:'caps'},...'asdfghjkl'.split('').map(c=>({normal:c})),
  {normal:';',shift:':',sub:':'},{normal:"'",shift:'"',sub:'"'},{key:'ENTER',label:'Enter',cls:'w22'}
 ],
 [
  {key:'SHIFT',label:'Shift',cls:'w22',type:'shift'},...'zxcvbnm'.split('').map(c=>({normal:c})),
  {normal:',',shift:'<',sub:'<'},{normal:'.',shift:'>',sub:'>'},{normal:'/',shift:'?',sub:'?'},
  {key:'SHIFT',label:'Shift',cls:'w22',type:'shift'}
 ],
 [
  {key:'CTRL',label:'Ctrl',cls:'w14',type:'mod'},{key:'WIN',label:'Win',cls:'w125',type:'mod'},
  {key:'ALT',label:'Alt',cls:'w125',type:'mod'},{key:'SPACE',label:'Space',cls:'w55'},
  {key:'ALT',label:'Alt',cls:'w125',type:'mod'},{key:'MENU',label:'Menu',cls:'w125'},
  {key:'CTRL',label:'Ctrl',cls:'w14',type:'mod'},
  {key:'LEFT',label:'←',cls:'arrow'},{key:'UP',label:'↑',cls:'arrow'},{key:'DOWN',label:'↓',cls:'arrow'},{key:'RIGHT',label:'→',cls:'arrow'}
 ]
];

let shiftOn=false,capsOn=false;
const activeMods=new Set();

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function printableValue(spec){
 const base=spec.normal||'';
 if(/[a-z]/.test(base))return (capsOn!==shiftOn)?base.toUpperCase():base.toLowerCase();
 return shiftOn&&spec.shift!==undefined?spec.shift:base;
}
function makeKey(spec,isFn=false){
 const b=document.createElement('button');
 b.className='key'+(isFn?' fn':'')+(spec.cls?' '+spec.cls:'')+(spec.type?' '+spec.type:'');
 if(spec.key)b.dataset.key=spec.key;
 if(spec.normal!==undefined){b.dataset.normal=spec.normal;if(spec.shift!==undefined)b.dataset.shift=spec.shift}
 const label=spec.label||(spec.normal!==undefined?String(spec.normal).toUpperCase():spec.key||'');
 b.innerHTML=spec.sub!==undefined?'<span class="sub">'+esc(spec.sub)+'</span><span class="main withSub">'+esc(label)+'</span>':'<span class="main">'+esc(label)+'</span>';

 let repeatTimer=null,repeatLoop=null;
 const fire=(rep=false)=>handleKey(spec,rep);
 b.addEventListener('pointerdown',e=>{
   e.preventDefault();haptic();b.classList.add('pressed');fire(false);
   if(['BACKSPACE','DELETE','LEFT','RIGHT','UP','DOWN'].includes(spec.key)){
     repeatTimer=setTimeout(()=>{repeatLoop=setInterval(()=>fire(true),58)},400);
   }
 });
 const stop=()=>{b.classList.remove('pressed');clearTimeout(repeatTimer);clearInterval(repeatLoop)};
 b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('pointerleave',stop);
 return b;
}
function updateLabels(){
 document.querySelectorAll('.key[data-normal]').forEach(b=>{
   const n=b.dataset.normal,s=b.dataset.shift;
   let v=/[a-z]/.test(n)?((capsOn!==shiftOn)?n.toUpperCase():n.toLowerCase()):(shiftOn&&s!==undefined?s:n);
   const m=b.querySelector('.main');if(m)m.textContent=v.toUpperCase();
 });
 document.querySelectorAll('.key.shift').forEach(b=>b.classList.toggle('active',shiftOn));
 document.querySelectorAll('.key.caps').forEach(b=>b.classList.toggle('active',capsOn));
 document.querySelectorAll('.key.mod').forEach(b=>b.classList.toggle('active',activeMods.has(b.dataset.key)));
}
function handleKey(spec,repeat){
 if(spec.type==='shift'){shiftOn=!shiftOn;updateLabels();return}
 if(spec.type==='caps'){capsOn=!capsOn;sendKey('CAPSLOCK');updateLabels();return}
 if(spec.type==='mod'){
   activeMods.has(spec.key)?activeMods.delete(spec.key):activeMods.add(spec.key);updateLabels();return;
 }
 const mods=[...activeMods];
 if(shiftOn&&spec.normal===undefined&&spec.key!=='SPACE')mods.push('SHIFT');
 if(spec.normal!==undefined){
   const v=printableValue(spec);
   activeMods.size?sendKey(v,mods):sendText(v);
 }else if(spec.key==='SPACE'){
   activeMods.size?sendKey('SPACE',mods):sendText(' ');
 }else sendKey(spec.key,mods);

 if(!repeat){
   shiftOn=false;
   ['CTRL','ALT','WIN'].forEach(m=>activeMods.delete(m));
   updateLabels();
 }
}
const fr=document.getElementById('functionRow');fnKeys.forEach(k=>fr.appendChild(makeKey(k,true)));
const kb=document.getElementById('keyboard');
rows.forEach(rr=>{const row=document.createElement('div');row.className='row';rr.forEach(k=>row.appendChild(makeKey(k)));kb.appendChild(row)});
updateLabels();

// Precision multi-touch trackpad with gesture arbitration
const pad=document.getElementById('pad');
let pointers=new Map(),primaryId=null,start=null,lastTap=0,dragging=false,moved=false,holdTimer=null;
let pendingDX=0,pendingDY=0,pendingWheel=0,pendingHWheel=0,rafScheduled=false;
let gesture=null,suppressMultiUntilClear=false;
const sensitivity=1.55;

function centroid(){
 const ps=[...pointers.values()];
 if(!ps.length)return{x:0,y:0};
 return{x:ps.reduce((s,p)=>s+p.x,0)/ps.length,y:ps.reduce((s,p)=>s+p.y,0)/ps.length};
}
function distance2(){
 const ps=[...pointers.values()];
 if(ps.length<2)return 0;
 return Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);
}
function flushPointer(){
 rafScheduled=false;
 if(Math.abs(pendingDX)+Math.abs(pendingDY)>0.15){
   send({type:'move',dx:pendingDX,dy:pendingDY});pendingDX=0;pendingDY=0;
 }
 if(Math.abs(pendingWheel)>=1){send({type:'wheel',delta:pendingWheel});pendingWheel=0}
 if(Math.abs(pendingHWheel)>=1){send({type:'hwheel',delta:pendingHWheel});pendingHWheel=0}
}
function scheduleFlush(){if(!rafScheduled){rafScheduled=true;requestAnimationFrame(flushPointer)}}
function beginGesture(){
 const cc=centroid(),dist=distance2();
 gesture={
   count:pointers.size,maxCount:pointers.size,
   startX:cc.x,startY:cc.y,lastX:cc.x,lastY:cc.y,
   startTime:Date.now(),moved:false,mode:'undecided',
   startDistance:dist,lastDistance:dist,pinchAccum:0
 };
}
pad.addEventListener('pointerdown',e=>{
 e.preventDefault();haptic();
 if(pointers.size===0)suppressMultiUntilClear=false;
 pad.setPointerCapture(e.pointerId);
 pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

 if(suppressMultiUntilClear)return;

 if(pointers.size===1){
   primaryId=e.pointerId;start={x:e.clientX,y:e.clientY};moved=false;dragging=false;gesture=null;
   clearTimeout(holdTimer);
   holdTimer=setTimeout(()=>{
     if(!moved&&pointers.size===1&&!suppressMultiUntilClear){
       dragging=true;send({type:'mouse',button:'left',action:'down'});
     }
   },480);
 }else{
   clearTimeout(holdTimer);
   if(dragging){send({type:'mouse',button:'left',action:'up'});dragging=false}
   primaryId=null;moved=true;beginGesture();
 }
});
pad.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId),cur={x:e.clientX,y:e.clientY};
 pointers.set(e.pointerId,cur);
 if(suppressMultiUntilClear)return;

 if(pointers.size>=2){
   if(!gesture||gesture.count!==pointers.size)beginGesture();

   const cc=centroid();
   const dx=cc.x-gesture.lastX,dy=cc.y-gesture.lastY;
   gesture.lastX=cc.x;gesture.lastY=cc.y;
   gesture.maxCount=Math.max(gesture.maxCount,pointers.size);

   const totalX=cc.x-gesture.startX,totalY=cc.y-gesture.startY;
   const centroidTravel=Math.abs(totalX)+Math.abs(totalY);
   if(centroidTravel>8)gesture.moved=true;

   if(pointers.size===2){
     const dist=distance2();
     const distDelta=dist-gesture.lastDistance;
     const distanceTravel=Math.abs(dist-gesture.startDistance);
     gesture.lastDistance=dist;

     if(gesture.mode==='undecided'){
       if(distanceTravel>11 && distanceTravel>centroidTravel*0.55){
         gesture.mode='pinch';
       }else if(centroidTravel>7){
         gesture.mode=Math.abs(totalX)>Math.abs(totalY)*1.15?'hscroll':'vscroll';
       }
     }

     if(gesture.mode==='pinch'){
       gesture.pinchAccum+=distDelta;
       if(Math.abs(gesture.pinchAccum)>20){
         sendKey(gesture.pinchAccum>0?'+':'-',['CTRL']);
         gesture.pinchAccum=0;
       }
     }else if(gesture.mode==='hscroll'){
       pendingHWheel+=dx*5.0;scheduleFlush();
     }else if(gesture.mode==='vscroll'){
       pendingWheel+=-dy*5.0;scheduleFlush();
     }
   }
   return;
 }

 if(primaryId===e.pointerId){
   if(start&&Math.abs(cur.x-start.x)+Math.abs(cur.y-start.y)>5){moved=true;clearTimeout(holdTimer)}
   pendingDX+=(cur.x-old.x)*sensitivity;
   pendingDY+=(cur.y-old.y)*sensitivity;
   scheduleFlush();
 }
});
function finishPointer(e){
 clearTimeout(holdTimer);
 const before=pointers.size;
 const endedGesture=gesture?{...gesture}:null;
 pointers.delete(e.pointerId);

 if(suppressMultiUntilClear){
   if(pointers.size===0){suppressMultiUntilClear=false;gesture=null}
   return;
 }

 if(before>=2 && endedGesture){
   const elapsed=Date.now()-endedGesture.startTime;
   const totalX=endedGesture.lastX-endedGesture.startX;
   const totalY=endedGesture.lastY-endedGesture.startY;
   const absX=Math.abs(totalX),absY=Math.abs(totalY);

   if(endedGesture.maxCount===2){
     if(endedGesture.mode==='undecided'&&!endedGesture.moved&&elapsed<360){
       send({type:'mouse',button:'right',action:'click'});
     }
   }else if(endedGesture.maxCount===3){
     if(absX>58||absY>58){
       if(absX>absY){
         sendKey('TAB',totalX>0?['ALT']:['ALT','SHIFT']);
       }else if(totalY<0){
         sendKey('TAB',['WIN']);
       }else{
         sendKey('D',['WIN']);
       }
     }
   }else if(endedGesture.maxCount>=4){
     if(absX>58){
       sendKey(totalX>0?'RIGHT':'LEFT',['CTRL','WIN']);
     }
   }

   suppressMultiUntilClear=pointers.size>0;
   gesture=null;
   primaryId=null;start=null;moved=true;
   return;
 }

 if(primaryId===e.pointerId){
   const now=Date.now();
   if(dragging){
     send({type:'mouse',button:'left',action:'up'});
   }else if(!moved){
     if(now-lastTap<320)send({type:'mouse',button:'left',action:'double'});
     else send({type:'mouse',button:'left',action:'click'});
     lastTap=now;
   }
   primaryId=null;start=null;dragging=false;moved=false;
 }
 if(pointers.size===0){gesture=null;suppressMultiUntilClear=false}
}
pad.addEventListener('pointerup',finishPointer);
pad.addEventListener('pointercancel',finishPointer);

function fireProfileAction(action){
 const [label,type,key,mods]=action;
 if(type==='cmd'){
   sendText(key);setTimeout(()=>sendKey('ENTER'),24);
 }else if(type==='sequence'){
   [...String(key)].forEach((ch,i)=>setTimeout(()=>sendKey(ch),i*42));
 }else if(type==='text'){
   sendText(key);
 }else{
   sendKey(key,mods||[]);
 }
}
function renderShortcuts(){
 const sg=document.getElementById('shortGrid');sg.innerHTML='';
 const list=profileShortcuts[currentProfile]||profileShortcuts.standard;
 list.forEach(action=>{
   const b=document.createElement('button');b.textContent=action[0];
   b.addEventListener('pointerdown',e=>{e.preventDefault();haptic();fireProfileAction(action)});
   sg.appendChild(b);
 });
}
window.onPcContext=(ctx)=>{
 currentProfile=ctx.profile||'standard';
 activeAppEl.textContent=ctx.activeApp||'Desktop';

};

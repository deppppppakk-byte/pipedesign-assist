<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b1220"/>
<title>WirelessKey</title>
<style>
:root{
  --bg:#0b1220;--panel:#111827;--panel2:#172033;--key:#202b3d;--key2:#28364b;
  --line:#334155;--text:#f8fafc;--muted:#94a3b8;--accent:#60a5fa;--ok:#34d399;--bad:#f87171
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
button,input{font:inherit}
.app{
  height:100dvh;display:flex;flex-direction:column;gap:5px;
  padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom))
}
.topbar{
  min-height:34px;display:flex;align-items:center;gap:5px;padding:3px 5px;
  background:var(--panel);border:1px solid #1e293b;border-radius:9px
}
.brand{font-weight:800;font-size:13px;white-space:nowrap}.brand b{color:var(--accent)}
.topbar input{
  height:27px;background:#0f172a;border:1px solid var(--line);border-radius:7px;color:var(--text);
  padding:0 7px;font-size:11px;outline:none
}
#host{width:155px}#code{width:68px;text-align:center;letter-spacing:1.5px}
.connect{
  height:27px;padding:0 10px;border:0;border-radius:7px;background:#1d4ed8;color:white;font-size:11px;font-weight:700
}
.status{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);margin-left:auto;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#64748b}.status.ok .dot{background:var(--ok)}.status.bad .dot{background:var(--bad)}

.workspace{flex:1;min-height:0;display:flex;gap:5px}
.keyboardPane{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.functionRow{height:9.5%;min-height:30px;display:flex;gap:3px}
.keyboard{flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:3px;flex:1;min-height:0}
.key{
  position:relative;flex:1;min-width:0;border:1px solid #344257;border-radius:7px;background:linear-gradient(#273449,#202b3d);
  color:var(--text);font-weight:650;font-size:clamp(10px,1.55vw,15px);box-shadow:inset 0 -2px rgba(0,0,0,.2);
  touch-action:none;user-select:none;-webkit-user-select:none
}
.key:active,.key.pressed{background:#3b4d68;transform:translateY(1px)}
.key.mod.active,.key.shift.active,.key.caps.active{background:#17365d;border-color:#60a5fa;box-shadow:inset 0 0 0 1px #60a5fa}
.key .main{display:block;line-height:1}
.key .sub{position:absolute;top:3px;left:5px;font-size:8px;color:#9fb0c8;font-weight:500}
.key .main.withSub{padding-top:8px}
.key.w125{flex:1.25}.key.w14{flex:1.4}.key.w15{flex:1.5}.key.w17{flex:1.7}.key.w19{flex:1.9}.key.w22{flex:2.2}.key.w55{flex:5.5}
.key.fn{font-size:9px;background:linear-gradient(#202b3d,#182234)}
.key.arrow{font-size:15px}
.mousePane{
  width:27%;min-width:155px;max-width:310px;display:flex;flex-direction:column;gap:4px
}
.touchpad{
  flex:1;min-height:0;position:relative;border:1px solid #36445a;border-radius:12px;
  background:
    radial-gradient(circle at 35% 25%,rgba(96,165,250,.06),transparent 38%),
    linear-gradient(145deg,#1a2536,#101827);
  touch-action:none;overflow:hidden
}
.touchpad .label{position:absolute;inset:0;display:grid;place-items:center;color:#607088;font-size:11px;pointer-events:none}
.touchpad .hint{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#526078;font-size:8px;pointer-events:none}
.mouseBtns{height:34px;display:flex;gap:4px}
.mouseBtns button{
  flex:1;border:1px solid #344257;border-radius:8px;background:var(--key2);color:var(--text);font-size:10px;font-weight:700
}
.scrollBar{
  width:22px;border-left:1px solid rgba(148,163,184,.16);position:absolute;right:0;top:0;bottom:0;
  display:flex;align-items:center;justify-content:center;color:#53657d;font-size:9px;writing-mode:vertical-rl;pointer-events:none
}
@media(max-height:520px){
  .topbar{min-height:28px}.topbar input,.connect{height:23px}.functionRow{min-height:26px}
  .row,.keyboard,.keyboardPane{gap:2px}.key{border-radius:5px;font-size:10px}.key.fn{font-size:8px}
}
@media(orientation:portrait){
  .workspace{flex-direction:column}.mousePane{width:100%;max-width:none;height:24%}.touchpad{min-height:90px}
  #host{width:120px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">Wireless<b>Key</b></div>
    <input id="host" placeholder="Laptop IP"/>
    <input id="code" placeholder="Code" maxlength="6" inputmode="numeric"/>
    <button class="connect" id="connectBtn">Connect</button>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Not connected</span></div>
  </div>

  <div class="workspace">
    <div class="keyboardPane">
      <div class="functionRow" id="functionRow"></div>
      <div class="keyboard" id="keyboard"></div>
    </div>

    <div class="mousePane">
      <div class="touchpad" id="pad">
        <div class="label">Touchpad</div>
        <div class="hint">Tap click · Hold drag · 2-finger scroll</div>
        <div class="scrollBar">SCROLL</div>
      </div>
      <div class="mouseBtns">
        <button data-mouse="left">Left Click</button>
        <button data-mouse="right">Right Click</button>
      </div>
    </div>
  </div>
</div>

<script>
const hostEl=document.getElementById('host');
const codeEl=document.getElementById('code');
const statusEl=document.getElementById('status');
const statusText=document.getElementById('statusText');

try{
  hostEl.value=Android.loadHost()||'';
  codeEl.value=Android.loadCode()||'';
}catch(e){}

function save(){
  try{Android.saveSettings(hostEl.value,codeEl.value)}catch(e){}
}
hostEl.addEventListener('change',save);
codeEl.addEventListener('input',()=>{
  codeEl.value=codeEl.value.replace(/\D/g,'').slice(0,6);
  save();
});
document.getElementById('connectBtn').addEventListener('click',()=>{
  save();setStatus('checking','Checking...');
  try{Android.testConnection(hostEl.value)}catch(e){setStatus('error','Bridge error')}
});

function setStatus(kind,text){
  statusText.textContent=text;
  statusEl.className='status'+((kind==='ready'||kind==='connected')?' ok':kind==='error'?' bad':'');
}
window.onNativeStatus=(kind,detail)=>setStatus(kind,detail||kind);

function send(event){
  if(!hostEl.value.trim()){setStatus('error','Enter laptop IP');return}
  if(codeEl.value.trim().length!==6){setStatus('error','Enter 6-digit code');return}
  save();
  try{Android.sendEvent(hostEl.value,codeEl.value,JSON.stringify(event))}
  catch(e){setStatus('error','Send failed')}
}

const specialNames=new Set([
  'ESC','BACKSPACE','TAB','CAPSLOCK','ENTER','SHIFT','CTRL','ALT','WIN','MENU',
  'HOME','END','PAGEUP','PAGEDOWN','DELETE','INSERT','LEFT','RIGHT','UP','DOWN',
  'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12',
  'VOLUME_DOWN','VOLUME_UP','VOLUME_MUTE','MEDIA_PREV','MEDIA_PLAY','MEDIA_NEXT'
]);

const fnKeys=[
  {key:'ESC',label:'Esc',cls:'w125'}, {key:'F1',label:'F1'}, {key:'F2',label:'F2'}, {key:'F3',label:'F3'},
  {key:'F4',label:'F4'}, {key:'F5',label:'F5'}, {key:'F6',label:'F6'}, {key:'F7',label:'F7'},
  {key:'F8',label:'F8'}, {key:'F9',label:'F9'}, {key:'F10',label:'F10'}, {key:'F11',label:'F11'}, {key:'F12',label:'F12'},
  {key:'DELETE',label:'Del',cls:'w125'}
];

const rows=[
  [
    {normal:'`',shift:'~',sub:'~'},{normal:'1',shift:'!',sub:'!'},{normal:'2',shift:'@',sub:'@'},
    {normal:'3',shift:'#',sub:'#'},{normal:'4',shift:'$',sub:'$'},{normal:'5',shift:'%',sub:'%'},
    {normal:'6',shift:'^',sub:'^'},{normal:'7',shift:'&',sub:'&'},{normal:'8',shift:'*',sub:'*'},
    {normal:'9',shift:'(',sub:'('},{normal:'0',shift:')',sub:')'},{normal:'-',shift:'_',sub:'_'},
    {normal:'=',shift:'+',sub:'+'},{key:'BACKSPACE',label:'Backspace',cls:'w19'}
  ],
  [
    {key:'TAB',label:'Tab',cls:'w15'},
    ...'qwertyuiop'.split('').map(c=>({normal:c})),
    {normal:'[',shift:'{',sub:'{'},{normal:']',shift:'}',sub:'}'},{normal:'\\',shift:'|',sub:'|',cls:'w15'}
  ],
  [
    {key:'CAPSLOCK',label:'Caps Lock',cls:'w17',type:'caps'},
    ...'asdfghjkl'.split('').map(c=>({normal:c})),
    {normal:';',shift:':',sub:':'},{normal:"'",shift:'"',sub:'"'},
    {key:'ENTER',label:'Enter',cls:'w22'}
  ],
  [
    {key:'SHIFT',label:'Shift',cls:'w22',type:'shift'},
    ...'zxcvbnm'.split('').map(c=>({normal:c})),
    {normal:',',shift:'<',sub:'<'},{normal:'.',shift:'>',sub:'>'},{normal:'/',shift:'?',sub:'?'},
    {key:'SHIFT',label:'Shift',cls:'w22',type:'shift'}
  ],
  [
    {key:'CTRL',label:'Ctrl',cls:'w14',type:'mod'},
    {key:'WIN',label:'Win',cls:'w125',type:'mod'},
    {key:'ALT',label:'Alt',cls:'w125',type:'mod'},
    {key:'SPACE',label:'Space',cls:'w55'},
    {key:'ALT',label:'Alt',cls:'w125',type:'mod'},
    {key:'MENU',label:'Menu',cls:'w125'},
    {key:'CTRL',label:'Ctrl',cls:'w14',type:'mod'},
    {key:'LEFT',label:'←',cls:'arrow'},{key:'UP',label:'↑',cls:'arrow'},
    {key:'DOWN',label:'↓',cls:'arrow'},{key:'RIGHT',label:'→',cls:'arrow'}
  ]
];

let shiftOn=false;
let capsOn=false;
const activeMods=new Set();

function printableValue(spec){
  const base=spec.normal||'';
  if(/[a-z]/.test(base)){
    const upper=(capsOn!==shiftOn);
    return upper?base.toUpperCase():base.toLowerCase();
  }
  return shiftOn && spec.shift!==undefined ? spec.shift : base;
}

function makeKey(spec,isFn=false){
  const b=document.createElement('button');
  let classes='key';
  if(isFn)classes+=' fn';
  if(spec.cls)classes+=' '+spec.cls;
  if(spec.type==='mod')classes+=' mod';
  if(spec.type==='shift')classes+=' shift';
  if(spec.type==='caps')classes+=' caps';
  if(spec.cls==='arrow')classes+=' arrow';
  b.className=classes;

  if(spec.key)b.dataset.key=spec.key;
  if(spec.normal!==undefined){
    b.dataset.normal=spec.normal;
    if(spec.shift!==undefined)b.dataset.shift=spec.shift;
  }

  if(spec.sub!==undefined){
    b.innerHTML='<span class="sub">'+escapeHtml(spec.sub)+'</span><span class="main withSub">'+escapeHtml(displayMain(spec))+'</span>';
  }else{
    b.innerHTML='<span class="main">'+escapeHtml(spec.label||displayMain(spec))+'</span>';
  }

  let repeatTimer=null,repeatInterval=null;
  const fire=()=>handleKey(spec,b);

  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    b.classList.add('pressed');
    fire();
    const repeatable=['BACKSPACE','LEFT','RIGHT','UP','DOWN','DELETE'].includes(spec.key);
    if(repeatable){
      repeatTimer=setTimeout(()=>{
        repeatInterval=setInterval(()=>handleKey(spec,b,true),70);
      },430);
    }
  });
  const stop=()=>{
    b.classList.remove('pressed');
    clearTimeout(repeatTimer);clearInterval(repeatInterval)
  };
  b.addEventListener('pointerup',stop);
  b.addEventListener('pointercancel',stop);
  b.addEventListener('pointerleave',stop);
  return b;
}

function displayMain(spec){
  if(spec.label)return spec.label;
  if(spec.normal===' ')return 'Space';
  return spec.normal!==undefined?String(spec.normal).toUpperCase():(spec.key||'');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))
}

function renderLabels(){
  document.querySelectorAll('.key[data-normal]').forEach(b=>{
    const normal=b.dataset.normal;
    const shift=b.dataset.shift;
    let value;
    if(/[a-z]/.test(normal)){
      value=(capsOn!==shiftOn)?normal.toUpperCase():normal.toLowerCase();
    }else{
      value=shiftOn&&shift!==undefined?shift:normal;
    }
    const main=b.querySelector('.main');
    if(main)main.textContent=value===' '?'Space':value.toUpperCase();
  });
}

function syncModifierVisuals(){
  document.querySelectorAll('.key.shift').forEach(b=>b.classList.toggle('active',shiftOn));
  document.querySelectorAll('.key.caps').forEach(b=>b.classList.toggle('active',capsOn));
  document.querySelectorAll('.key.mod').forEach(b=>{
    const k=b.dataset.key;
    b.classList.toggle('active',activeMods.has(k));
  });
  renderLabels();
}

function handleKey(spec,b,repeat=false){
  if(spec.type==='shift'){
    shiftOn=!shiftOn;syncModifierVisuals();return;
  }
  if(spec.type==='caps'){
    capsOn=!capsOn;
    send({type:'key',key:'CAPSLOCK',modifiers:[]});
    syncModifierVisuals();return;
  }
  if(spec.type==='mod'){
    const k=spec.key;
    if(activeMods.has(k))activeMods.delete(k);else activeMods.add(k);
    syncModifierVisuals();return;
  }

  const mods=[...activeMods];
  if(shiftOn && spec.normal===undefined && spec.key!=='SPACE')mods.push('SHIFT');

  if(spec.normal!==undefined){
    const value=printableValue(spec);
    if(activeMods.size>0){
      send({type:'key',key:value,modifiers:mods});
    }else{
      send({type:'text',text:value});
    }
  }else if(spec.key==='SPACE'){
    if(activeMods.size>0)send({type:'key',key:'SPACE',modifiers:mods});
    else send({type:'text',text:' '});
  }else{
    send({type:'key',key:spec.key,modifiers:mods});
  }

  if(!repeat){
    if(shiftOn){shiftOn=false}
    for(const m of ['CTRL','ALT','WIN'])activeMods.delete(m);
    syncModifierVisuals();
  }
}

const fnRow=document.getElementById('functionRow');
fnKeys.forEach(k=>fnRow.appendChild(makeKey(k,true)));

const keyboard=document.getElementById('keyboard');
rows.forEach(rowSpec=>{
  const row=document.createElement('div');
  row.className='row';
  rowSpec.forEach(k=>row.appendChild(makeKey(k,false)));
  keyboard.appendChild(row);
});
syncModifierVisuals();

// Touchpad
const pad=document.getElementById('pad');
let primary=null,start=null,moved=false,dragging=false;
let holdTimer=null;
let touchPoints=new Map();
let lastTwoY=null;
const sensitivity=1.65;

function mouseSend(event){send(event)}

pad.addEventListener('pointerdown',e=>{
  e.preventDefault();
  pad.setPointerCapture(e.pointerId);
  touchPoints.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(touchPoints.size===1){
    primary={id:e.pointerId,x:e.clientX,y:e.clientY};
    start={x:e.clientX,y:e.clientY};
    moved=false;dragging=false;
    clearTimeout(holdTimer);
    holdTimer=setTimeout(()=>{
      if(!moved&&touchPoints.size===1){
        dragging=true;
        mouseSend({type:'mouse',button:'left',action:'down'});
      }
    },480);
  }else if(touchPoints.size===2){
    clearTimeout(holdTimer);
    const pts=[...touchPoints.values()];
    lastTwoY=(pts[0].y+pts[1].y)/2;
  }
});

pad.addEventListener('pointermove',e=>{
  if(!touchPoints.has(e.pointerId))return;
  const old=touchPoints.get(e.pointerId);
  const current={x:e.clientX,y:e.clientY};
  touchPoints.set(e.pointerId,current);

  if(touchPoints.size===2){
    clearTimeout(holdTimer);
    const pts=[...touchPoints.values()];
    const y=(pts[0].y+pts[1].y)/2;
    if(lastTwoY!==null){
      const dy=y-lastTwoY;
      if(Math.abs(dy)>2){
        mouseSend({type:'wheel',delta:dy>0?-120:120});
        lastTwoY=y;
      }
    }
    return;
  }

  if(primary && primary.id===e.pointerId){
    const dx=(current.x-old.x)*sensitivity;
    const dy=(current.y-old.y)*sensitivity;
    if(start && Math.abs(current.x-start.x)+Math.abs(current.y-start.y)>5){
      moved=true;clearTimeout(holdTimer)
    }
    if(Math.abs(dx)+Math.abs(dy)>0.4)mouseSend({type:'move',dx,dy});
  }
});

function finishPointer(e){
  clearTimeout(holdTimer);
  touchPoints.delete(e.pointerId);
  if(primary&&primary.id===e.pointerId){
    if(dragging){
      mouseSend({type:'mouse',button:'left',action:'up'});
    }else if(!moved){
      mouseSend({type:'mouse',button:'left',action:'click'});
    }
    primary=null;start=null;moved=false;dragging=false;
  }
  if(touchPoints.size<2)lastTwoY=null;
}
pad.addEventListener('pointerup',finishPointer);
pad.addEventListener('pointercancel',finishPointer);

document.querySelectorAll('[data-mouse]').forEach(b=>{
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    mouseSend({type:'mouse',button:b.dataset.mouse,action:'click'});
  });
});

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>

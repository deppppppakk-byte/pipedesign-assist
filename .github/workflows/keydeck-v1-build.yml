name: KeyDeck v1 Build

on:
  push:
    branches:
      - keydeck-v1-build
    paths:
      - '.keydeck-build-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify v1.2.1 source and regressions
        shell: bash
        run: |
          echo "89123bd81fd2eefa90e8d8e60898e8533f41121900fad489a6f9926815ce852a  keydeck-ci/KeyDeck-v1.2.1-CI-Source.zip" | sha256sum -c -
          rm -rf /tmp/keydeck
          mkdir -p /tmp/keydeck
          unzip -q keydeck-ci/KeyDeck-v1.2.1-CI-Source.zip -d /tmp/keydeck
          test -f /tmp/keydeck/KeyDeck_v1_2_1/android/app/build.gradle
          test -f /tmp/keydeck/KeyDeck_v1_2_1/receiver/main.go
          python /tmp/keydeck/KeyDeck_v1_2_1/qc/full_keyboard_qc.py
          grep -F 'new LinearLayout.LayoutParams(0,-1,weights[i])' /tmp/keydeck/KeyDeck_v1_2_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java
          grep -F 'hello.put("code", pendingPairCode)' /tmp/keydeck/KeyDeck_v1_2_1/android/app/src/main/java/in/tamishra/keydeck/ConnectionManager.java
          grep -F 'pairCode := strings.TrimSpace(hello.Code)' /tmp/keydeck/KeyDeck_v1_2_1/receiver/main.go
          grep -F 'TestFreshCodeBypassesStaleTrust' /tmp/keydeck/KeyDeck_v1_2_1/receiver/protocol_test.go
          grep -F 'TestHotspotLanRangesAccepted' /tmp/keydeck/KeyDeck_v1_2_1/receiver/protocol_test.go
          grep -F 'KEYEVENTF_EXTENDEDKEY' /tmp/keydeck/KeyDeck_v1_2_1/receiver/input_windows.go

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: /tmp/keydeck/KeyDeck_v1_2_1/android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/KeyDeck-v1.2.1-Android.apk
          sha256sum /tmp/KeyDeck-v1.2.1-Android.apk > /tmp/KeyDeck-v1.2.1-Android.apk.sha256
          test -s /tmp/KeyDeck-v1.2.1-Android.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging /tmp/KeyDeck-v1.2.1-Android.apk)"
          echo "$BADGING" | grep -F "package: name='in.tamishra.keydeck' versionCode='10201' versionName='1.2.1'"
          echo "$BADGING" | grep -F "application-label:'KeyDeck'"

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Test and build Windows receiver
        working-directory: /tmp/keydeck/KeyDeck_v1_2_1/receiver
        shell: bash
        run: |
          go mod tidy
          go mod verify
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go test -v .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w" -o /tmp/KeyDeckReceiver-v1.2.1.exe .
          test -s /tmp/KeyDeckReceiver-v1.2.1.exe
          mkdir -p /tmp/KeyDeck-Windows
          cp /tmp/KeyDeckReceiver-v1.2.1.exe /tmp/KeyDeck-Windows/
          cp Allow-KeyDeck-Firewall.ps1 README.txt /tmp/KeyDeck-Windows/
          cd /tmp
          zip -qr KeyDeck-v1.2.1-Windows-Receiver.zip KeyDeck-Windows
          sha256sum KeyDeck-v1.2.1-Windows-Receiver.zip > KeyDeck-v1.2.1-Windows-Receiver.zip.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.2.1-Android
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.2.1-Android.apk
            /tmp/KeyDeck-v1.2.1-Android.apk.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.2.1-Windows
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.2.1-Windows-Receiver.zip
            /tmp/KeyDeck-v1.2.1-Windows-Receiver.zip.sha256

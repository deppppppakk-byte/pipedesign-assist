name: KeyDeck v1 Build

on:
  push:
    branches:
      - keydeck-v1-build
    paths:
      - '.keydeck-build-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify source archive
        shell: bash
        run: |
          echo "93155861dba1c5b49289bd3231c8cde18c84e61df74596915c98af640388a7bb  keydeck-ci/KeyDeck-v1.0.0-CI-Source.zip" | sha256sum -c -
          rm -rf /tmp/keydeck
          mkdir -p /tmp/keydeck
          unzip -q keydeck-ci/KeyDeck-v1.0.0-CI-Source.zip -d /tmp/keydeck
          test -f /tmp/keydeck/KeyDeck/android/app/build.gradle
          test -f /tmp/keydeck/KeyDeck/receiver/main.go

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: /tmp/keydeck/KeyDeck/android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/KeyDeck-v1.0.0-Android.apk
          sha256sum /tmp/KeyDeck-v1.0.0-Android.apk > /tmp/KeyDeck-v1.0.0-Android.apk.sha256
          test -s /tmp/KeyDeck-v1.0.0-Android.apk

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build native Windows receiver
        working-directory: /tmp/keydeck/KeyDeck/receiver
        shell: bash
        run: |
          go mod tidy
          go mod verify
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-H windowsgui -s -w" -o /tmp/KeyDeckReceiver-v1.0.0.exe .
          test -s /tmp/KeyDeckReceiver-v1.0.0.exe
          mkdir -p /tmp/KeyDeck-Windows
          cp /tmp/KeyDeckReceiver-v1.0.0.exe /tmp/KeyDeck-Windows/
          cp Allow-KeyDeck-Firewall.ps1 README.txt /tmp/KeyDeck-Windows/
          cd /tmp
          zip -qr KeyDeck-v1.0.0-Windows-Receiver.zip KeyDeck-Windows
          sha256sum KeyDeck-v1.0.0-Windows-Receiver.zip > KeyDeck-v1.0.0-Windows-Receiver.zip.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.0.0-Android
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.0.0-Android.apk
            /tmp/KeyDeck-v1.0.0-Android.apk.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.0.0-Windows
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.0.0-Windows-Receiver.zip
            /tmp/KeyDeck-v1.0.0-Windows-Receiver.zip.sha256

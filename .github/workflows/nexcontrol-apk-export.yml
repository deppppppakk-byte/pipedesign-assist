name: NexControl APK Export

on:
  push:
    branches:
      - temp/nexcontrol-v11-railway-build
    paths:
      - ".github/workflows/nexcontrol-apk-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download NexControl APK
        run: |
          set -euo pipefail
          url="https://nexcontrol-apk-final-production.up.railway.app/NexControl-v1.1.0-debug.apk"
          curl -fL --retry 4 --retry-delay 2 "$url" -o NexControl-v1.1.0-debug.apk
          test -s NexControl-v1.1.0-debug.apk
          sha256sum NexControl-v1.1.0-debug.apk > NexControl-v1.1.0-debug.apk.sha256
          ls -lh NexControl-v1.1.0-debug.apk
          cat NexControl-v1.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Android
          if-no-files-found: error
          retention-days: 14
          path: |
            NexControl-v1.1.0-debug.apk
            NexControl-v1.1.0-debug.apk.sha256

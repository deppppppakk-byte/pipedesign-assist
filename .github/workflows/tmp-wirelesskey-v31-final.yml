name: Temporary WirelessKey v3.1 Release APK QA

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'

jobs:
  android-release-final:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate embedded JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("app/src/main/assets/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          assert blocks, "No script block found"
          Path("/tmp/wirelesskey.js").write_text("\n".join(blocks), encoding="utf-8")
          PY
          node --check /tmp/wirelesskey.js

      - name: Android release lint and build
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='3.1'" /tmp/badging.txt
          grep -q "application-label:'WirelessKey'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then
            echo "Release APK is unexpectedly debuggable"
            exit 1
          fi
          unzip -t "$APK"

      - name: Upload final release APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v3.1-Final-Release-APK
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

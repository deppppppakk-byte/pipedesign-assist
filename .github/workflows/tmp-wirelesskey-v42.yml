name: Temporary WirelessKey v4.2 Precision Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'
      - 'wirelesskey-v4/**'

jobs:
  android-v42:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Architecture checks
        shell: bash
        run: |
          grep -q 'versionName "4.2"' app/build.gradle
          grep -q 'sendPointerMove' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'queueSize()' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'ByteBuffer.allocate(9)' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'class ResizableSplitLayout' app/src/main/java/com/wirelesskey/remote/ResizableSplitLayout.java
          grep -q 'showControlCenter' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'showWorkspace' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'buildCadWorkspace' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'QRScannerActivity.class' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1
      - name: Lint and build release
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.2'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.2-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-v42:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build native receiver
        run: dotnet build WirelessKeyReceiver.csproj -c Release
      - name: Runtime TLS + binary pointer self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            exit $LASTEXITCODE
          }
      - name: Publish receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Test packaged EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged receiver self-test failed: $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item ALLOW_FIREWALL_PRIVATE.bat publish/
          Copy-Item README.txt publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.2-Windows.zip -Force
          Expand-Archive WirelessKey-v4.2-Windows.zip verify -Force
          if (-not (Test-Path verify/WirelessKeyReceiver.exe)) { throw "Receiver missing" }
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.2-Windows
          path: wirelesskey-v4/windows/WirelessKey-v4.2-Windows.zip
          if-no-files-found: error

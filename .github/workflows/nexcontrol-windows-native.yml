name: NexControl Windows Native

on:
  push:
    branches:
      - temp/nexcontrol-v11-railway-build
    paths:
      - ".github/workflows/nexcontrol-windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified NexControl source export
        shell: pwsh
        run: |
          $base = "https://nexcontrol-v1-1-android-build-production.up.railway.app"
          $archive = Join-Path $env:RUNNER_TEMP "NexControl-v1.1.0-windows-source.tar.gz"
          $checksum = "$archive.sha256"

          Invoke-WebRequest -UseBasicParsing "$base/NexControl-v1.1.0-windows-source.tar.gz" -OutFile $archive
          Invoke-WebRequest -UseBasicParsing "$base/NexControl-v1.1.0-windows-source.tar.gz.sha256" -OutFile $checksum

          if (-not (Test-Path $archive) -or (Get-Item $archive).Length -lt 1024) {
            throw "NexControl source export download failed."
          }

          $expected = ((Get-Content -Raw $checksum).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "NexControl source export checksum mismatch."
          }

          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xzf $archive -C src
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed." }

          @(
            "src/host/tray_host.py",
            "src/host/server.py",
            "src/host/requirements.txt",
            "src/host/requirements-windows.txt",
            "src/host/requirements-webrtc.txt",
            "src/installer/NexControlHost.iss"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing required source: $_" }
          }

      - name: Install Windows host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r src/host/requirements.txt
          python -m pip install -r src/host/requirements-windows.txt
          python -m pip install -r src/host/requirements-webrtc.txt
          python -m pip install pyinstaller "livekit==1.1.19"

      - name: Protocol regression QA
        shell: pwsh
        run: |
          Push-Location src
          python -m compileall -q host relay tests
          if (Test-Path tests/test_v10.py) {
            python tests/test_v10.py
          }
          Pop-Location

      - name: Source launch smoke test
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "nexcontrol-source.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "nexcontrol-source.stderr.log"
          Push-Location src
          try {
            $p = Start-Process -FilePath python -ArgumentList @("-u", "host/tray_host.py") -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              Write-Host "Source host exited early with code $($p.ExitCode)"
              if (Test-Path $stdout) { Get-Content $stdout -Raw }
              if (Test-Path $stderr) { Get-Content $stderr -Raw }
              throw "NexControl source host failed launch smoke test."
            }
            Stop-Process -Id $p.Id -Force
            Write-Host "Source host stayed alive for launch smoke test."
          }
          finally {
            Pop-Location
          }

      - name: Build NexControlHost.exe
        shell: pwsh
        run: |
          Push-Location src
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexControlHost --add-data "mobile;mobile" --collect-all aiortc --collect-all av --collect-all livekit host/tray_host.py
          if (-not (Test-Path "dist/NexControlHost.exe")) {
            throw "PyInstaller did not create NexControlHost.exe."
          }
          New-Item -ItemType Directory -Force -Path host/dist | Out-Null
          Copy-Item "dist/NexControlHost.exe" "host/dist/NexControlHost.exe" -Force
          Pop-Location

      - name: Build diagnostic console host
        shell: pwsh
        run: |
          Push-Location src
          python -m PyInstaller --noconfirm --clean --onefile --console --name NexControlHost-Diagnostic --add-data "mobile;mobile" --collect-all aiortc --collect-all av --collect-all livekit host/tray_host.py
          if (-not (Test-Path "dist/NexControlHost-Diagnostic.exe")) {
            throw "PyInstaller did not create diagnostic host."
          }
          Pop-Location

      - name: Bundled host launch smoke test
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "nexcontrol-bundled.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "nexcontrol-bundled.stderr.log"
          $exe = (Resolve-Path "src/dist/NexControlHost-Diagnostic.exe").Path
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Host "Bundled host exited early with code $($p.ExitCode)"
            if (Test-Path $stdout) { Write-Host "=== STDOUT ==="; Get-Content $stdout -Raw }
            if (Test-Path $stderr) { Write-Host "=== STDERR ==="; Get-Content $stderr -Raw }
            throw "Bundled NexControl host failed launch smoke test."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Bundled host stayed alive for launch smoke test."

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          Push-Location src
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc) {
            $isccCandidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            )
            $iscc = $isccCandidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) {
            Get-ChildItem "C:\Program Files*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 10 -ExpandProperty FullName
            throw "Inno Setup compiler not found."
          }

          & $iscc "installer\NexControlHost.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $setup = "installer\Output\NexControlHost-1.1.0-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "Installer output missing: $setup"
          }
          Pop-Location

      - name: Installer smoke test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "src/installer/Output/NexControlHost-1.1.0-Setup.exe").Path
          $log = (Join-Path $env:RUNNER_TEMP "NexControl-install.log")
          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/LOG=$log")

          $p = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if (Test-Path $log) {
            Copy-Item $log "src/installer/NexControl-install-smoke.log" -Force
            Get-Content $log -Tail 120
          }

          if ($p.ExitCode -ne 0) {
            throw "Installer smoke test failed with exit code $($p.ExitCode)"
          }

          $destLine = Select-String -Path $log -Pattern 'Dest filename: .*NexControlHost\.exe' |
            Select-Object -Last 1

          if (-not $destLine) {
            throw "Installer returned success but its log contains no NexControlHost.exe destination."
          }

          $installedPath = ($destLine.Line -replace '^.*Dest filename:\s*', '').Trim()
          if (-not (Test-Path $installedPath)) {
            throw "Installer log reports NexControlHost.exe at '$installedPath', but the file does not exist."
          }

          Write-Host "Installed NexControl host: $installedPath"

      - name: Installed host launch smoke test
        shell: pwsh
        run: |
          $log = (Join-Path $env:RUNNER_TEMP "NexControl-install.log")
          $destLine = Select-String -Path $log -Pattern 'Dest filename: .*NexControlHost\.exe' | Select-Object -Last 1
          $installedPath = ($destLine.Line -replace '^.*Dest filename:\s*', '').Trim()
          $p = Start-Process -FilePath $installedPath -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            throw "Installed NexControlHost.exe exited immediately with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Installed host stayed alive for launch smoke test."

      - name: Upload installer smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Installer-Smoke-Log
          if-no-files-found: ignore
          retention-days: 14
          path: src/installer/NexControl-install-smoke.log

      - name: Upload launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Launch-Diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/nexcontrol-source.stdout.log
            ${{ runner.temp }}/nexcontrol-source.stderr.log
            ${{ runner.temp }}/nexcontrol-bundled.stdout.log
            ${{ runner.temp }}/nexcontrol-bundled.stderr.log

      - name: Create SHA-256 files
        shell: pwsh
        run: |
          $hostExe = "src/host/dist/NexControlHost.exe"
          $setupExe = "src/installer/Output/NexControlHost-1.1.0-Setup.exe"

          $hostHash = (Get-FileHash $hostExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()

          "$hostHash  NexControlHost.exe" | Set-Content -NoNewline "src/host/dist/NexControlHost.exe.sha256"
          "$setupHash  NexControlHost-1.1.0-Setup.exe" | Set-Content -NoNewline "src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256"

      - name: Upload NexControl Windows release
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src/host/dist/NexControlHost.exe
            src/host/dist/NexControlHost.exe.sha256
            src/installer/Output/NexControlHost-1.1.0-Setup.exe
            src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256

name: NexControl Windows Native

on:
  push:
    branches:
      - nexcontrol/windows-native-workflow
    paths:
      - ".github/workflows/nexcontrol-windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BUILD_KEY: ${{ secrets.BUILD_KEY }}

    steps:
      - name: Checkout NexControl protected build branch
        uses: actions/checkout@v4
        with:
          ref: temp/nexcontrol-v11-railway-build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct protected source
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUILD_KEY)) {
            throw "Repository secret BUILD_KEY is missing."
          }

          $dir = Join-Path $PWD "nexcontrol-build"
          $payload = ""
          foreach ($p in @(
            "windows-source.part00","windows-source.part01",
            "windows-source.part02a","windows-source.part02b",
            "windows-source.part03a","windows-source.part03b",
            "windows-source.part03c","windows-source.part03d"
          )) {
            $payload += (Get-Content -Raw (Join-Path $dir $p)).Trim()
          }

          $hex = ""
          foreach ($p in @(
            "windows-source.part04h0","windows-source.part04h1",
            "windows-source.part04h2","windows-source.part04h3"
          )) {
            $hex += (Get-Content -Raw (Join-Path $dir $p)).Trim()
          }

          $payload += -join (0..(($hex.Length / 2) - 1) | ForEach-Object {
            [char][Convert]::ToByte($hex.Substring($_ * 2, 2), 16)
          })

          $enc = Join-Path $env:RUNNER_TEMP "nexcontrol.enc"
          $xz  = Join-Path $env:RUNNER_TEMP "nexcontrol.tar.xz"
          [IO.File]::WriteAllBytes($enc, [Convert]::FromBase64String($payload))

          & openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BUILD_KEY -in $enc -out $xz
          if ($LASTEXITCODE -ne 0) { throw "Source decryption failed." }

          $expected = "5fbf620605e7fb2b340851c833e02f2630b43f4dbf6faf3df249efdd1a1cf425"
          $actual = (Get-FileHash $xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Source checksum mismatch." }

          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xJf $xz -C src
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed." }

      - name: Install Windows host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r src/host/requirements.txt
          python -m pip install -r src/host/requirements-windows.txt
          python -m pip install -r src/host/requirements-webrtc.txt
          python -m pip install pyinstaller "livekit==1.1.19"

      - name: Protocol QA
        shell: pwsh
        run: |
          Push-Location src
          python -m compileall -q host relay tests
          if (Test-Path tests/test_v10.py) { python tests/test_v10.py }
          Pop-Location

      - name: Build host executable
        shell: pwsh
        run: |
          Push-Location src
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexControlHost --add-data "mobile;mobile" --collect-all aiortc --collect-all av --collect-all livekit host/tray_host.py
          if (-not (Test-Path "dist/NexControlHost.exe")) { throw "NexControlHost.exe missing." }
          New-Item -ItemType Directory -Force -Path host/dist | Out-Null
          Copy-Item "dist/NexControlHost.exe" "host/dist/NexControlHost.exe" -Force
          Pop-Location

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          Push-Location src
          $iscc = @(
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found." }
          & $iscc "installer\NexControlHost.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }
          Pop-Location

      - name: Create checksums
        shell: pwsh
        run: |
          $hostExe = "src/host/dist/NexControlHost.exe"
          $setupExe = "src/installer/Output/NexControlHost-1.1.0-Setup.exe"
          if (-not (Test-Path $setupExe)) { throw "Setup EXE missing." }
          $hostHash = (Get-FileHash $hostExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hostHash  NexControlHost.exe" | Set-Content -NoNewline "src/host/dist/NexControlHost.exe.sha256"
          "$setupHash  NexControlHost-1.1.0-Setup.exe" | Set-Content -NoNewline "src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Windows
          retention-days: 14
          if-no-files-found: error
          path: |
            src/host/dist/NexControlHost.exe
            src/host/dist/NexControlHost.exe.sha256
            src/installer/Output/NexControlHost-1.1.0-Setup.exe
            src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256

name: NexControl Windows Native

on:
  push:
    branches:
      - nexcontrol/windows-native-workflow
    paths:
      - ".github/workflows/nexcontrol-windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified NexControl source
        shell: pwsh
        run: |
          $base = "https://nexcontrol-v1-1-android-build-production.up.railway.app"
          $bundle = Join-Path $env:RUNNER_TEMP "NexControl-v1.1.0-windows-source.tar.gz"
          $checksumFile = "$bundle.sha256"

          Invoke-WebRequest "$base/NexControl-v1.1.0-windows-source.tar.gz" -OutFile $bundle
          Invoke-WebRequest "$base/NexControl-v1.1.0-windows-source.tar.gz.sha256" -OutFile $checksumFile

          if (-not (Test-Path $bundle) -or (Get-Item $bundle).Length -le 0) {
            throw "NexControl source bundle download failed."
          }

          $expected = ((Get-Content -Raw $checksumFile).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $bundle -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "NexControl source bundle checksum mismatch."
          }

          New-Item -ItemType Directory -Force -Path src | Out-Null
          tar -xzf $bundle -C src
          if ($LASTEXITCODE -ne 0) { throw "Source extraction failed." }

          @(
            "src/host/tray_host.py",
            "src/host/server.py",
            "src/host/requirements.txt",
            "src/host/requirements-windows.txt",
            "src/host/requirements-webrtc.txt",
            "src/installer/NexControlHost.iss"
          ) | ForEach-Object {
            if (-not (Test-Path $_)) { throw "Missing required source: $_" }
          }

      - name: Install Windows host dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r src/host/requirements.txt
          python -m pip install -r src/host/requirements-windows.txt
          python -m pip install -r src/host/requirements-webrtc.txt
          python -m pip install pyinstaller "livekit==1.1.19"

      - name: Protocol QA
        shell: pwsh
        run: |
          Push-Location src
          python -m compileall -q host
          if (Test-Path relay) { python -m compileall -q relay }
          if (Test-Path tests) { python -m compileall -q tests }
          if (Test-Path tests/test_v10.py) { python tests/test_v10.py }
          Pop-Location

      - name: Build host executable
        shell: pwsh
        run: |
          Push-Location src
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name NexControlHost --add-data "mobile;mobile" --collect-all aiortc --collect-all av --collect-all livekit host/tray_host.py
          if (-not (Test-Path "dist/NexControlHost.exe")) { throw "NexControlHost.exe missing." }
          New-Item -ItemType Directory -Force -Path host/dist | Out-Null
          Copy-Item "dist/NexControlHost.exe" "host/dist/NexControlHost.exe" -Force
          Pop-Location

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          Push-Location src
          $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $iscc = if ($cmd) { $cmd.Source } else { $null }

          if (-not $iscc) {
            $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
            $candidates = @(
              (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
              (Join-Path $env:ChocolateyInstall "bin\ISCC.exe")
            )
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }

          if (-not $iscc) {
            Get-ChildItem "C:\Program Files*" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host $_.FullName }
            throw "ISCC.exe not found."
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "installer\NexControlHost.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed." }

          if (-not (Test-Path "installer\Output\NexControlHost-1.1.0-Setup.exe")) {
            throw "NexControl installer output missing."
          }
          Pop-Location

      - name: Create checksums
        shell: pwsh
        run: |
          $hostExe = "src/host/dist/NexControlHost.exe"
          $setupExe = "src/installer/Output/NexControlHost-1.1.0-Setup.exe"
          $hostHash = (Get-FileHash $hostExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $setupHash = (Get-FileHash $setupExe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hostHash  NexControlHost.exe" | Set-Content -NoNewline "src/host/dist/NexControlHost.exe.sha256"
          "$setupHash  NexControlHost-1.1.0-Setup.exe" | Set-Content -NoNewline "src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexControl-v1.1.0-Windows
          retention-days: 14
          if-no-files-found: error
          path: |
            src/host/dist/NexControlHost.exe
            src/host/dist/NexControlHost.exe.sha256
            src/installer/Output/NexControlHost-1.1.0-Setup.exe
            src/installer/Output/NexControlHost-1.1.0-Setup.exe.sha256

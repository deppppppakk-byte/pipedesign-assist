name: Temporary WirelessKey v4 Native Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'
      - 'wirelesskey-v4/**'

jobs:
  android-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify WebView is removed from runtime
        shell: bash
        run: |
          if grep -R "android.webkit.WebView" app/src/main/java; then
            echo "WebView runtime dependency still present"
            exit 1
          fi
      - name: Lint and build native release
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify release metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.0'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.0-Native-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore and build
        run: dotnet build WirelessKeyReceiver.csproj -c Release
      - name: Run native encrypted self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            exit $LASTEXITCODE
          }
      - name: Publish self-contained native receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Test packaged EXE
        shell: pwsh
        run: |
          Remove-Item (Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt") -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            throw "Native EXE self-test failed: $($p.ExitCode)"
          }
      - name: Package native receiver
        shell: pwsh
        run: |
          Copy-Item ../../wirelesskey-v11/receiver/ALLOW_FIREWALL_PRIVATE.bat publish/
          Copy-Item ../../wirelesskey-v11/receiver/README.txt publish/README-v3.txt
          @"
          WIRELESSKEY 4.0 NATIVE RECEIVER
          ================================
          WirelessKey v4 uses a native .NET Windows receiver and native Android UI.
          Run WirelessKeyReceiver.exe. The app stays in the system tray when closed.
          If discovery is blocked, run ALLOW_FIREWALL_PRIVATE.bat as Administrator once.
          "@ | Set-Content publish/README.txt
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.0-Native-Windows.zip -Force
          Expand-Archive WirelessKey-v4.0-Native-Windows.zip verify -Force
          if (-not (Test-Path verify/WirelessKeyReceiver.exe)) { throw "Receiver missing from package" }
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.0-Native-Windows
          path: wirelesskey-v4/windows/WirelessKey-v4.0-Native-Windows.zip
          if-no-files-found: error

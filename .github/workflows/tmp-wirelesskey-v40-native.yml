name: Temporary WirelessKey v4 Native Android

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'

jobs:
  android-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify WebView is removed from runtime
        shell: bash
        run: |
          if grep -R "android.webkit.WebView" app/src/main/java; then
            echo "WebView runtime dependency still present"
            exit 1
          fi
      - name: Lint and build native release
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace
      - name: Verify release metadata
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.0'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.0-Native-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

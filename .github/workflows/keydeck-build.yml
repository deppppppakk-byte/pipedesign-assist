name: Build KeyDeck v1.0
on:
  push:
    branches: [ wirelesskey-v5-apk-20260927 ]
    paths:
      - 'keydeck-source.part*'
      - '.github/workflows/keydeck-build.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract KeyDeck source
        run: |
          mkdir keydeck-build
          cat keydeck-source.part00 keydeck-source.part01 keydeck-source.part02 keydeck-source.part03 | base64 -d > /tmp/keydeck-source.tgz
          echo "073dc5b3ad59519711bc3da0178b0c95f93af274ccc82e7cac3d3e6699fb2c52  /tmp/keydeck-source.tgz" | sha256sum -c -
          tar -xzf /tmp/keydeck-source.tgz -C keydeck-build
      - name: Build Android APK
        working-directory: keydeck-build/android
        run: gradle --no-daemon clean assembleDebug
      - name: Rename APK
        run: cp keydeck-build/android/app/build/outputs/apk/debug/app-debug.apk KeyDeck-v1.0.0-Android.apk
      - name: Verify APK
        run: |
          test -s KeyDeck-v1.0.0-Android.apk
          file KeyDeck-v1.0.0-Android.apk
          sha256sum KeyDeck-v1.0.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.0.0-Android
          path: KeyDeck-v1.0.0-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Extract KeyDeck source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force keydeck-build | Out-Null
          $b64 = (Get-Content keydeck-source.part00 -Raw) + (Get-Content keydeck-source.part01 -Raw) + (Get-Content keydeck-source.part02 -Raw) + (Get-Content keydeck-source.part03 -Raw)
          $tgz = "$env:RUNNER_TEMP\keydeck-source.tgz"
          [IO.File]::WriteAllBytes($tgz, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $tgz -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "073dc5b3ad59519711bc3da0178b0c95f93af274ccc82e7cac3d3e6699fb2c52") { throw "Source SHA256 mismatch: $hash" }
          tar -xzf $tgz -C keydeck-build
      - name: Build Windows GUI receiver
        working-directory: keydeck-build/receiver
        run: go build -trimpath -ldflags "-s -w -H=windowsgui" -o KeyDeckReceiver.exe .
      - name: Package receiver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force KeyDeck-Receiver | Out-Null
          Copy-Item keydeck-build/receiver/KeyDeckReceiver.exe KeyDeck-Receiver/
          Copy-Item keydeck-build/receiver/Allow-KeyDeck-Firewall.ps1 KeyDeck-Receiver/
          Copy-Item keydeck-build/receiver/README.txt KeyDeck-Receiver/
          Compress-Archive -Path KeyDeck-Receiver/* -DestinationPath KeyDeck-v1.0.0-Windows-Receiver.zip -Force
          Get-FileHash KeyDeck-Receiver/KeyDeckReceiver.exe -Algorithm SHA256
          Get-FileHash KeyDeck-v1.0.0-Windows-Receiver.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.0.0-Windows-Receiver
          path: KeyDeck-v1.0.0-Windows-Receiver.zip

name: Temporary WirelessKey v4.2.1 Aesthetic Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'

jobs:
  android-v421:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Aesthetic architecture checks
        shell: bash
        run: |
          grep -q 'versionName "4.2.1"' app/build.gradle
          grep -q 'WirelessKeyTheme' app/src/main/AndroidManifest.xml
          grep -q 'Control Center' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'PRECISION' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'class ScanFrameView' app/src/main/java/com/wirelesskey/remote/QRScannerActivity.java
          grep -q 'TOUCHPAD' app/src/main/java/com/wirelesskey/remote/TouchpadView.java
          ! grep -R "Theme.Material.Light" app/src/main || exit 1
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1

      - name: Lint and build release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:lintRelease :app:assembleRelease --stacktrace; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.2.1'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.2.1-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

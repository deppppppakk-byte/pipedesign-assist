name: Temporary WirelessKey v4.1.3 Native Scanner

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'

jobs:
  android-v413:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Scanner architecture checks
        shell: bash
        run: |
          grep -q 'android:name=".QRScannerActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' app/src/main/AndroidManifest.xml
          grep -q "androidx.camera:camera-core" app/build.gradle
          grep -q "barcode-scanning" app/build.gradle
          grep -q "Choose QR image" app/src/main/java/com/wirelesskey/remote/QRScannerActivity.java
          grep -q "QRScannerActivity.class" app/src/main/java/com/wirelesskey/remote/MainActivity.java
          ! grep -R "GmsBarcodeScanning\|IntentIntegrator\|IntentResult\|journeyapps\|zxing-android-embedded" app/src/main/java app/build.gradle || exit 1
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1

      - name: Lint and build release
        run: gradle :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.1.3'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.CAMERA'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then
            echo "Release APK unexpectedly debuggable"
            exit 1
          fi
          unzip -t "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.1.3-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

name: KeyDeck Android v1.3.1

on:
  push:
    branches:
      - keydeck-v1-build
    paths:
      - '.keydeck-android-aesthetic-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify aesthetic Android source
        shell: bash
        run: |
          echo "114be9b963459f1d084f04ced8f1ac40d01c662519b3a9d9cc477a138e187eb2  keydeck-ci/KeyDeck-v1.3.1-Android-CI-Source.zip" | sha256sum -c -
          rm -rf /tmp/keydeck131
          mkdir -p /tmp/keydeck131
          unzip -q keydeck-ci/KeyDeck-v1.3.1-Android-CI-Source.zip -d /tmp/keydeck131
          python /tmp/keydeck131/KeyDeck_v1_3_1/qc/android_apk_qc.py
          grep -F 'REMOTE INPUT' /tmp/keydeck131/KeyDeck_v1_3_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java
          grep -F 'updateModeVisuals()' /tmp/keydeck131/KeyDeck_v1_3_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java
          grep -F 'StateListDrawable keyBackground' /tmp/keydeck131/KeyDeck_v1_3_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java
          grep -F 'setSegmentVisual' /tmp/keydeck131/KeyDeck_v1_3_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java
          grep -F 'ColorDrawable(Color.TRANSPARENT)' /tmp/keydeck131/KeyDeck_v1_3_1/android/app/src/main/java/in/tamishra/keydeck/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build aesthetic APK
        working-directory: /tmp/keydeck131/KeyDeck_v1_3_1/android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/KeyDeck-v1.3.1-Android.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging /tmp/KeyDeck-v1.3.1-Android.apk)"
          echo "$BADGING" | grep -F "package: name='in.tamishra.keydeck' versionCode='10301' versionName='1.3.1'"
          echo "$BADGING" | grep -F "application-label:'KeyDeck'"
          sha256sum /tmp/KeyDeck-v1.3.1-Android.apk > /tmp/KeyDeck-v1.3.1-Android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.3.1-Android
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.3.1-Android.apk
            /tmp/KeyDeck-v1.3.1-Android.apk.sha256

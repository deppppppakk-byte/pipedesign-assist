name: KeyDeck Android v1.3.0

on:
  push:
    branches:
      - keydeck-v1-build
    paths:
      - '.keydeck-android-build-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android source snapshot
        shell: bash
        run: |
          echo "b09e54c0d72955e284426b4e7a0fd000947fb9a7827c9b1b3a9228f87e7ba96f  keydeck-ci/KeyDeck-v1.3.0-Android-CI-Source.zip" | sha256sum -c -
          rm -rf /tmp/keydeck130
          mkdir -p /tmp/keydeck130
          unzip -q keydeck-ci/KeyDeck-v1.3.0-Android-CI-Source.zip -d /tmp/keydeck130
          python /tmp/keydeck130/KeyDeck_v1_3_0/qc/android_apk_qc.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: /tmp/keydeck130/KeyDeck_v1_3_0/android
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/KeyDeck-v1.3.0-Android.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging /tmp/KeyDeck-v1.3.0-Android.apk)"
          echo "$BADGING" | grep -F "package: name='in.tamishra.keydeck' versionCode='10300' versionName='1.3.0'"
          echo "$BADGING" | grep -F "application-label:'KeyDeck'"
          sha256sum /tmp/KeyDeck-v1.3.0-Android.apk > /tmp/KeyDeck-v1.3.0-Android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.3.0-Android
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.3.0-Android.apk
            /tmp/KeyDeck-v1.3.0-Android.apk.sha256

name: Temporary WirelessKey v4 Native Windows Repack

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v4/windows/**'

jobs:
  windows-native:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build native receiver
        run: dotnet build WirelessKeyReceiver.csproj -c Release
      - name: Run encrypted runtime self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish compact self-contained receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Test packaged EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Native EXE self-test failed: $($p.ExitCode)" }
      - name: Package
        shell: pwsh
        run: |
          Copy-Item ALLOW_FIREWALL_PRIVATE.bat publish/
          Copy-Item README.txt publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.0-Native-Windows.zip -Force
          Expand-Archive WirelessKey-v4.0-Native-Windows.zip verify -Force
          if (-not (Test-Path verify/WirelessKeyReceiver.exe)) { throw "Receiver missing" }
          Get-ChildItem verify | Format-Table Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.0-Native-Windows-Compact
          path: wirelesskey-v4/windows/WirelessKey-v4.0-Native-Windows.zip
          if-no-files-found: error

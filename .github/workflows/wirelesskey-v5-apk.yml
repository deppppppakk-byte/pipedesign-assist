name: WirelessKey v5 APK

on:
  push:
    branches:
      - wirelesskey-v5-apk-20260927
    paths:
      - 'wirelesskey-v5/android/**'
      - '.github/workflows/wirelesskey-v5-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: wirelesskey-v5/android
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp wirelesskey-v5/android/app/build/outputs/apk/debug/app-debug.apk WirelessKey-v5.0.1-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v5.0.1-Android
          path: WirelessKey-v5.0.1-Android.apk
          if-no-files-found: error

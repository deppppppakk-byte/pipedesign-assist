name: WirelessKey v5.1 QC APK

on:
  push:
    branches:
      - wirelesskey-v5-apk-20260927
    paths:
      - 'wirelesskey-v5/android/**'
      - '.github/workflows/wirelesskey-v5-apk.yml'
  workflow_dispatch:

concurrency:
  group: wirelesskey-v5-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source parity QC
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "versionName[[:space:]]+['\"]5\\.1\\.0['\"]" wirelesskey-v5/android/app/build.gradle
          grep -q 'sensorLandscape' wirelesskey-v5/android/app/src/main/AndroidManifest.xml
          grep -q 'Multiwork' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/MainActivity.java
          grep -q '"Deck"' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/MainActivity.java
          grep -q '"CAD"' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/MainActivity.java
          grep -q 'mouseButton' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/TouchpadView.java
          grep -q 'mouseButton' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/ConnectionManager.java
          grep -q 'lastPong' wirelesskey-v5/android/app/src/main/java/in/tamishra/wirelesskey/ConnectionManager.java

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: wirelesskey-v5/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug

      - name: APK QC
        shell: bash
        run: |
          set -euo pipefail
          APK=wirelesskey-v5/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='in.tamishra.wirelesskey.debug'" apk-badging.txt
          grep -q "versionName='5.1.0-debug'" apk-badging.txt
          cp "$APK" WirelessKey-v5.1.0-QC.apk
          sha256sum WirelessKey-v5.1.0-QC.apk > WirelessKey-v5.1.0-QC.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v5.1.0-QC
          path: |
            WirelessKey-v5.1.0-QC.apk
            WirelessKey-v5.1.0-QC.apk.sha256
            apk-badging.txt
          if-no-files-found: error

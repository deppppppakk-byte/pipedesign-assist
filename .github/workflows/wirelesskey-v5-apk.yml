name: WirelessKey v5 APK

on:
  push:
    branches:
      - wirelesskey-v5-apk-20260927
    paths:
      - 'wirelesskey-v5/android/**'
      - '.github/workflows/wirelesskey-v5-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: wirelesskey-v5/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle --no-daemon clean assembleDebug

      - name: Rename APK
        run: cp wirelesskey-v5/android/app/build/outputs/apk/debug/app-debug.apk WirelessKey-v5.0.1-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v5.0.1-Android
          path: WirelessKey-v5.0.1-Android.apk
          if-no-files-found: error

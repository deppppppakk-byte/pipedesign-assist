name: Tamishra APK Public Builder

on:
  push:
    branches: [tamishra-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamishra-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Build APK and Android lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace

      - name: APK QA checks
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          mkdir -p ../qa
          "$AAPT" dump badging "$APK" | tee ../qa/apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee ../qa/apk-permissions.txt
          unzip -l "$APK" | tee ../qa/apk-files.txt
          sha256sum "$APK" | tee ../qa/sha256.txt

          grep -q "package: name='com.tamishra.mobile'" ../qa/apk-badging.txt
          grep -q "versionCode='5'" ../qa/apk-badging.txt
          grep -q "versionName='0.4.0'" ../qa/apk-badging.txt
          grep -q "application-label:'Tamishra'" ../qa/apk-badging.txt
          grep -q "launchable-activity: name='com.tamishra.mobile.MainActivity'" ../qa/apk-badging.txt
          grep -q "application-icon-" ../qa/apk-badging.txt
          grep -q "android.permission.INTERNET" ../qa/apk-permissions.txt
          grep -q "android.permission.CAMERA" ../qa/apk-permissions.txt
          grep -q "android.permission.RECORD_AUDIO" ../qa/apk-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" ../qa/apk-permissions.txt

          cp "$APK" ../Tamishra-v0.4.0.apk

      - name: Native shell source QA
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/in/tamishra/mobile/MainActivity.kt"
          grep -q 'buildNativeShell()' "$FILE"
          grep -q 'fun buildHomeView' "$FILE"
          grep -q '"Live Classroom"' "$FILE"
          grep -q '"Tamishra Meet"' "$FILE"
          grep -q '"My Account"' "$FILE"
          grep -q 'buildBottomBar' "$FILE"
          grep -q '.header,.footer,.footer-v40{display:none!important}' "$FILE"
          grep -q 'uri.host == "live"' "$FILE"
          grep -q 'uri.host == "meet"' "$FILE"
          grep -q 'TamishraAndroid/0.4' "$FILE"
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' app/src/main/AndroidManifest.xml
          {
            echo "Tamishra Android v0.4.0 QA"
            echo "PASS: native Android shell"
            echo "PASS: native Home/Live/Meet/Account navigation"
            echo "PASS: website header/footer suppressed inside app WebView"
            echo "PASS: Live and Meet deep links"
            echo "PASS: launcher icon"
            echo "PASS: Android lintDebug"
            echo "PASS: camera/audio/native screen-share permissions packaged"
          } > ../qa/summary.txt

      - name: Upload APK and QA report
        uses: actions/upload-artifact@v4
        with:
          name: Tamishra-v0.4.0-Native-APK-QA
          path: |
            Tamishra-v0.4.0.apk
            qa/
            tamishra-android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7

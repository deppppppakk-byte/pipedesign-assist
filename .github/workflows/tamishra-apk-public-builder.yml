name: Tamishra Meet APK Builder

on:
  push:
    branches: [tamishra-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tamishra-meet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: APK QA
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          mkdir -p ../qa
          "$AAPT" dump badging "$APK" | tee ../qa/apk-badging.txt
          "$AAPT" dump permissions "$APK" | tee ../qa/apk-permissions.txt
          sha256sum "$APK" | tee ../qa/sha256.txt

          grep -q "package: name='com.tamishra.meet'" ../qa/apk-badging.txt
          grep -q "versionCode='1'" ../qa/apk-badging.txt
          grep -q "versionName='1.0.0'" ../qa/apk-badging.txt
          grep -q "application-label:'Tamishra Meet'" ../qa/apk-badging.txt
          grep -q "launchable-activity: name='com.tamishra.meet.MainActivity'" ../qa/apk-badging.txt
          grep -q "application-icon-" ../qa/apk-badging.txt
          grep -q "android.permission.INTERNET" ../qa/apk-permissions.txt
          grep -q "android.permission.CAMERA" ../qa/apk-permissions.txt
          grep -q "android.permission.RECORD_AUDIO" ../qa/apk-permissions.txt
          grep -q "android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" ../qa/apk-permissions.txt

          cp "$APK" ../Tamishra-Meet-v1.0.0.apk

      - name: Source QA
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/tamishra/meet/MainActivity.kt"
          grep -q 'HOME_URL = "https://www.tamishra.in/meet"' "$FILE"
          grep -q 'TamishraMeetAndroid/1.0' "$FILE"
          grep -q 'uri.host == "meet"' "$FILE"
          ! grep -q 'uri.host == "live"' "$FILE"
          grep -q '.header,.footer,.footer-v40{display:none!important}' "$FILE"
          grep -q 'android:host="meet"' app/src/main/AndroidManifest.xml
          ! grep -q 'android:host="live"' app/src/main/AndroidManifest.xml
          {
            echo "Tamishra Meet Android v1.0.0 QA"
            echo "PASS: standalone package com.tamishra.meet"
            echo "PASS: Meet-only startup"
            echo "PASS: no Live Classroom deep link"
            echo "PASS: Meet deep link"
            echo "PASS: native Android screen sharing bridge"
            echo "PASS: camera and microphone permissions"
            echo "PASS: launcher icon"
          } > ../qa/summary.txt

      - name: Upload APK and QA report
        uses: actions/upload-artifact@v4
        with:
          name: Tamishra-Meet-v1.0.0-APK-QA
          path: |
            Tamishra-Meet-v1.0.0.apk
            qa/
          if-no-files-found: error
          retention-days: 7

name: KeyDeck Professional Android v1.5.1

on:
  push:
    branches:
      - keydeck-v1-build
    paths:
      - '.keydeck-prof-v151-ready'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Verify base source and professional patch
        shell: bash
        run: |
          set -euo pipefail
          echo "114be9b963459f1d084f04ced8f1ac40d01c662519b3a9d9cc477a138e187eb2  keydeck-ci/KeyDeck-v1.3.1-Android-CI-Source.zip" | sha256sum -c -
          echo "2a892221c7dc4a1488f7c9b771c1a6fd2c81c1594d90bfcdf075bb9e4f5c86bc  keydeck-ci/KeyDeck-v1.5.1-Android-from-v1.3.1.patch" | sha256sum -c -
          rm -rf /tmp/keydeck151
          mkdir -p /tmp/keydeck151
          unzip -q keydeck-ci/KeyDeck-v1.3.1-Android-CI-Source.zip -d /tmp/keydeck151
          cd /tmp/keydeck151/KeyDeck_v1_3_1
          patch -p1 < "$GITHUB_WORKSPACE/keydeck-ci/KeyDeck-v1.5.1-Android-from-v1.3.1.patch"
          python qc/full_keyboard_qc.py
          python qc/android_apk_qc.py
          grep -F 'public static final int PROTOCOL = 6;' android/app/src/main/java/in/tamishra/keydeck/ConnectionManager.java
          grep -F 'conn.connectFromQr(host,port,code,name,token,instance)' android/app/src/main/java/in/tamishra/keydeck/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build matched v1.5.1 APK
        working-directory: /tmp/keydeck151/KeyDeck_v1_3_1/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/KeyDeck-v1.5.1-Android.apk
          test -s /tmp/KeyDeck-v1.5.1-Android.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          BADGING="$("$AAPT" dump badging /tmp/KeyDeck-v1.5.1-Android.apk)"
          echo "$BADGING" | grep -F "package: name='in.tamishra.keydeck' versionCode='10501' versionName='1.5.1'"
          echo "$BADGING" | grep -F "application-label:'KeyDeck'"
          sha256sum /tmp/KeyDeck-v1.5.1-Android.apk > /tmp/KeyDeck-v1.5.1-Android.apk.sha256

      - name: Upload matched Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyDeck-v1.5.1-Android
          if-no-files-found: error
          path: |
            /tmp/KeyDeck-v1.5.1-Android.apk
            /tmp/KeyDeck-v1.5.1-Android.apk.sha256

name: Temporary WirelessKey APK Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-apk/**'

jobs:
  build-wirelesskey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-APK
          path: wirelesskey-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

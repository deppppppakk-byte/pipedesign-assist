name: Temporary WirelessKey v1.1 Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v1.1-APK
          path: wirelesskey-v11/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-windows-receiver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Build receiver EXE
        run: pyinstaller --onefile --console --name WirelessKeyReceiver wirelesskey-v11/receiver/wirelesskey_receiver.py
      - name: Package receiver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/WirelessKeyReceiver.exe package/
          Copy-Item wirelesskey-v11/receiver/ALLOW_FIREWALL_PRIVATE.bat package/
          Copy-Item wirelesskey-v11/receiver/README.txt package/
          Compress-Archive -Path package/* -DestinationPath WirelessKey-v1.1-Windows-Receiver.zip -Force
      - name: Upload receiver
        uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v1.1-Windows-Receiver
          path: WirelessKey-v1.1-Windows-Receiver.zip
          if-no-files-found: error

name: Temporary WirelessKey v4.5 Installer Diagnostics

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'
      - 'wirelesskey-v4/**'

jobs:
  android-v45:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: v4.5 source checks
        shell: bash
        run: |
          grep -q 'versionName "4.5"' app/build.gradle
          grep -q 'WIRELESSKEY_ANDROID_KEYSTORE' app/build.gradle
          grep -q 'autoConnectPreferredPc' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'cancelPointerMotion' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'QRScannerActivity.class' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1
      - name: Lint and build release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:lintRelease :app:assembleRelease --stacktrace; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1
      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.5'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-v45:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Source and release-prep checks
        shell: pwsh
        run: |
          Select-String ReceiverHost.cs -Pattern "ReceiverDiagnostics" -Quiet | Out-Null
          Select-String MainForm.cs -Pattern "ShowDiagnostics" -Quiet | Out-Null
          Select-String MainForm.cs -Pattern "Copy report" -Quiet | Out-Null
          Select-String installer/WirelessKey.iss -Pattern "WirelessKeySetup-4.5" -Quiet | Out-Null
          Select-String installer/WirelessKey.iss -Pattern "advfirewall" -Quiet | Out-Null
          Select-String sign-release.ps1 -Pattern "WIRELESSKEY_SIGNING_PASSWORD" -Quiet | Out-Null
          Select-String WirelessKeyReceiver.csproj -Pattern "<FileVersion>4.5.0.0</FileVersion>" -Quiet | Out-Null

      - name: Build receiver
        run: dotnet build WirelessKeyReceiver.csproj -c Release

      - name: Runtime TLS pointer trust and diagnostics self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            exit $LASTEXITCODE
          }

      - name: Publish self-contained receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Prepare published files
        shell: pwsh
        run: |
          Copy-Item README.txt publish/README.txt -Force
          $version = (Get-Item publish/WirelessKeyReceiver.exe).VersionInfo
          Write-Host "FileVersion=$($version.FileVersion)"
          Write-Host "ProductVersion=$($version.ProductVersion)"
          if ($version.FileVersion -notlike "4.5.0.0*") { throw "Incorrect receiver file version: $($version.FileVersion)" }

      - name: Test packaged receiver
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Published receiver self-test failed: $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\WirelessKey.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          $setup = "installer\output\WirelessKeySetup-4.5.exe"
          if (-not (Test-Path $setup)) { throw "Installer output missing." }

      - name: Silent installer end-to-end test
        shell: pwsh
        run: |
          $setup = (Resolve-Path "installer\output\WirelessKeySetup-4.5.exe").Path
          $target = Join-Path $env:TEMP "WirelessKey-v45-InstallTest"
          if (Test-Path $target) { Remove-Item $target -Recurse -Force }
          $args = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=","/DIR=$target")
          $install = Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed: $($install.ExitCode)" }
          $exe = Join-Path $target "WirelessKeyReceiver.exe"
          if (-not (Test-Path $exe)) { throw "Installed receiver missing." }
          $test = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed receiver self-test failed: $($test.ExitCode)" }
          $uninstaller = Join-Path $target "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing." }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
          if (Test-Path $exe) { throw "Receiver remained after uninstall." }

      - name: Package portable receiver
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.5-Windows-Portable.zip -Force
          Expand-Archive WirelessKey-v4.5-Windows-Portable.zip verify -Force
          if (-not (Test-Path verify/WirelessKeyReceiver.exe)) { throw "Portable receiver missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Installer
          path: wirelesskey-v4/windows/installer/output/WirelessKeySetup-4.5.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Portable
          path: wirelesskey-v4/windows/WirelessKey-v4.5-Windows-Portable.zip
          if-no-files-found: error

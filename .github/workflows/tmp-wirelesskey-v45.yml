name: Temporary WirelessKey v4.5 Installer Diagnostics

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'
      - 'wirelesskey-v4/**'

jobs:
  android-v45:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: v4.5 source checks
        shell: bash
        run: |
          grep -q 'versionName "4.5"' app/build.gradle
          grep -q 'WIRELESSKEY_ANDROID_KEYSTORE' app/build.gradle
          grep -q 'showAndroidDiagnostics' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'Run connection test' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          grep -q 'getSocketQueueBytes' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'runConnectionTest' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'QRScannerActivity.class' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1

      - name: Lint and build release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:lintRelease :app:assembleRelease --stacktrace; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.5'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-v45:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: v4.5 source checks
        shell: pwsh
        run: |
          Select-String ReceiverHost.cs -Pattern "ReceiverDiagnostics" -Quiet | Out-Null
          Select-String MainForm.cs -Pattern "ShowDiagnostics" -Quiet | Out-Null
          Select-String MainForm.cs -Pattern "Copy report" -Quiet | Out-Null
          Select-String WirelessKeyReceiver.csproj -Pattern "<Version>4.5.0</Version>" -Quiet | Out-Null
          Select-String installer/WirelessKey.iss -Pattern "WirelessKeySetup-4.5" -Quiet | Out-Null
          Select-String sign-release.ps1 -Pattern "signtool" -Quiet | Out-Null

      - name: Build receiver
        run: dotnet build WirelessKeyReceiver.csproj -c Release

      - name: Runtime TLS, pointer, trust and diagnostics self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            exit $LASTEXITCODE
          }

      - name: Publish receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Test packaged receiver
        shell: pwsh
        run: |
          Copy-Item README.txt publish/
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged receiver self-test failed: $($p.ExitCode)" }

      - name: Package portable receiver
        shell: pwsh
        run: |
          Copy-Item ALLOW_FIREWALL_PRIVATE.bat publish/ -ErrorAction SilentlyContinue
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.5-Windows-Portable.zip -Force
          Expand-Archive WirelessKey-v4.5-Windows-Portable.zip verify-portable -Force
          if (-not (Test-Path verify-portable/WirelessKeyReceiver.exe)) { throw "Portable receiver missing" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\WirelessKey.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup build failed" }
          if (-not (Test-Path "installer\output\WirelessKeySetup-4.5.exe")) { throw "Installer missing" }

      - name: Silent installer round-trip test
        shell: pwsh
        run: |
          $setup = Resolve-Path "installer\output\WirelessKeySetup-4.5.exe"
          $qaDir = Join-Path $env:TEMP "WirelessKey45InstallerQA"
          Remove-Item $qaDir -Recurse -Force -ErrorAction SilentlyContinue

          $install = Start-Process -FilePath $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/TASKS=",
            "/DIR=$qaDir"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer returned $($install.ExitCode)" }

          $receiver = Join-Path $qaDir "WirelessKeyReceiver.exe"
          if (-not (Test-Path $receiver)) { throw "Installed receiver missing" }

          $self = Start-Process -FilePath $receiver -ArgumentList "--self-test" -Wait -PassThru
          if ($self.ExitCode -ne 0) { throw "Installed receiver self-test failed: $($self.ExitCode)" }

          $uninstaller = Join-Path $qaDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller returned $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Portable
          path: wirelesskey-v4/windows/WirelessKey-v4.5-Windows-Portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Installer
          path: wirelesskey-v4/windows/installer/output/WirelessKeySetup-4.5.exe
          if-no-files-found: error

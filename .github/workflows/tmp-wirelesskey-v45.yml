name: Temporary WirelessKey v4.5 Installer Diagnostics

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'wirelesskey-v11/**'
      - 'wirelesskey-v4/**'

jobs:
  android-v45:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wirelesskey-v11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Release-readiness source checks
        shell: bash
        run: |
          grep -q 'versionName "4.5"' app/build.gradle
          grep -q 'WIRELESSKEY_ANDROID_KEYSTORE' app/build.gradle
          grep -q 'wirelessRelease' app/build.gradle
          grep -q 'appVersion", "4.5"' app/src/main/java/com/wirelesskey/remote/SecureLink.java
          grep -q 'QRScannerActivity.class' app/src/main/java/com/wirelesskey/remote/MainActivity.java
          ! grep -R "android.webkit.WebView" app/src/main/java || exit 1

      - name: Lint and build release
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :app:lintRelease :app:assembleRelease --stacktrace; then
              exit 0
            fi
            echo "Gradle attempt $attempt failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "versionName='4.5'" /tmp/badging.txt
          if grep -q "application-debuggable" /tmp/badging.txt; then exit 1; fi
          unzip -t "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Android
          path: wirelesskey-v11/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  windows-v45:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wirelesskey-v4/windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Installer and diagnostics source checks
        shell: pwsh
        run: |
          if (-not (Select-String ReceiverHost.cs -Pattern "ReceiverDiagnostics" -Quiet)) { throw "Diagnostics model missing" }
          if (-not (Select-String MainForm.cs -Pattern "ShowDiagnostics" -Quiet)) { throw "Diagnostics UI missing" }
          if (-not (Select-String NativeSelfTest.cs -Pattern "diagnostics.PointerPackets" -Quiet)) { throw "Diagnostics self-test missing" }
          if (-not (Select-String WirelessKeySetup.iss -Pattern "PrivilegesRequired=admin" -Quiet)) { throw "Installer elevation missing" }
          if (-not (Select-String install-firewall.ps1 -Pattern "WirelessKey Receiver TCP" -Quiet)) { throw "TCP firewall rule missing" }
          if (-not (Select-String install-firewall.ps1 -Pattern "New-NetFirewallRule" -Quiet)) { throw "PowerShell firewall creation missing" }
          if (-not (Select-String remove-firewall.ps1 -Pattern "Remove-NetFirewallRule" -Quiet)) { throw "Firewall cleanup helper missing" }
          if (-not (Select-String sign-release.ps1 -Pattern "signtool.exe" -Quiet)) { throw "Signing helper missing" }

      - name: Build receiver
        run: dotnet build WirelessKeyReceiver.csproj -c Release

      - name: Runtime TLS, pointer, trust and diagnostics self-test
        shell: pwsh
        run: |
          dotnet run --project WirelessKeyReceiver.csproj -c Release -- --self-test
          if ($LASTEXITCODE -ne 0) {
            $err = Join-Path $env:TEMP "wirelesskey-v4-selftest-error.txt"
            if (Test-Path $err) { Get-Content $err }
            exit $LASTEXITCODE
          }

      - name: Publish receiver
        run: dotnet publish WirelessKeyReceiver.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Test packaged receiver
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD\publish\WirelessKeyReceiver.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Packaged receiver self-test failed: $($p.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }

      - name: Build WirelessKeySetup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "WirelessKeySetup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (-not (Test-Path "installer-output\WirelessKeySetup.exe")) { throw "Installer output missing" }

      - name: Firewall capability probe
        id: firewallprobe
        shell: pwsh
        run: |
          $probeName = "WirelessKey CI Firewall Probe"
          $probeCapable = $false
          try {
            Get-NetFirewallRule -DisplayName $probeName -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
            New-NetFirewallRule -DisplayName $probeName -Direction Inbound -Action Allow -Profile Private -Protocol TCP -LocalPort 48765 -Program "$PWD\publish\WirelessKeyReceiver.exe" -Enabled True | Out-Null
            $probeCapable = [bool](Get-NetFirewallRule -DisplayName $probeName -ErrorAction SilentlyContinue)
          } catch {
            Write-Host "Firewall probe failed: $($_.Exception.Message)"
          } finally {
            Get-NetFirewallRule -DisplayName $probeName -ErrorAction SilentlyContinue | Remove-NetFirewallRule -ErrorAction SilentlyContinue
          }
          "FIREWALL_CAPABLE=$($probeCapable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Firewall capability: $probeCapable"

      - name: Silent installer lifecycle test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:TEMP "WirelessKey-v45-install-test"
          $setupLog = Join-Path $env:TEMP "WirelessKeySetup-v45.log"
          $fwLog = Join-Path $env:TEMP "wirelesskey-firewall-install.log"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $setupLog,$fwLog -Force -ErrorAction SilentlyContinue
          $setup = (Resolve-Path "installer-output\WirelessKeySetup.exe").Path
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$installDir","/LOG=$setupLog" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog }
            if (Test-Path $fwLog) { Get-Content $fwLog }
            throw "Silent installer failed: $($install.ExitCode)"
          }
          $installedExe = Join-Path $installDir "WirelessKeyReceiver.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed receiver missing" }
          $test = Start-Process -FilePath $installedExe -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Installed receiver self-test failed: $($test.ExitCode)" }

          $tcpRule = Get-NetFirewallRule -DisplayName "WirelessKey Receiver TCP" -ErrorAction SilentlyContinue
          $udpRule = Get-NetFirewallRule -DisplayName "WirelessKey Discovery UDP" -ErrorAction SilentlyContinue
          if ($env:FIREWALL_CAPABLE -eq "true") {
            if (-not $tcpRule -or -not $udpRule) {
              if (Test-Path $setupLog) { Get-Content $setupLog }
              if (Test-Path $fwLog) { Get-Content $fwLog }
              throw "Firewall-capable runner did not receive WirelessKey firewall rules"
            }
          } else {
            Write-Host "Runner cannot create firewall rules; validating installer/helper packaging instead."
            if (-not (Test-Path (Join-Path $installDir "support\install-firewall.ps1"))) { throw "Installed firewall helper missing" }
            if (-not (Test-Path (Join-Path $installDir "support\remove-firewall.ps1"))) { throw "Installed firewall cleanup helper missing" }
            if (Test-Path $fwLog) { Get-Content $fwLog }
          }

          $uninstaller = Get-ChildItem $installDir -Filter "unins*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller missing" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed: $($uninstall.ExitCode)" }
          Start-Sleep -Seconds 2

          if ($env:FIREWALL_CAPABLE -eq "true") {
            if (Get-NetFirewallRule -DisplayName "WirelessKey Receiver TCP" -ErrorAction SilentlyContinue) { throw "TCP firewall rule remained after uninstall" }
            if (Get-NetFirewallRule -DisplayName "WirelessKey Discovery UDP" -ErrorAction SilentlyContinue) { throw "UDP firewall rule remained after uninstall" }
          }
          if (Test-Path $installedExe) { throw "Installed receiver remained after uninstall" }

      - name: Package portable receiver
        shell: pwsh
        run: |
          Copy-Item README.txt publish/
          Copy-Item ALLOW_FIREWALL_PRIVATE.bat publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish/* -DestinationPath WirelessKey-v4.5-Windows-Portable.zip -Force
          Expand-Archive WirelessKey-v4.5-Windows-Portable.zip verify -Force
          if (-not (Test-Path verify/WirelessKeyReceiver.exe)) { throw "Portable receiver missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Setup
          path: wirelesskey-v4/windows/installer-output/WirelessKeySetup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: WirelessKey-v4.5-Windows-Portable
          path: wirelesskey-v4/windows/WirelessKey-v4.5-Windows-Portable.zip
          if-no-files-found: error